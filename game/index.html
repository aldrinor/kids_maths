"use strict";
const $ = s => document.querySelector(s);
const FAST = window.__demoFast ? 0.2 : 1;            // tests run the teaching faster
let breakHold = null;                                  // while the child is on a break the lesson waits at its next pause
const wait = ms => new Promise(r => setTimeout(() => { if (breakHold) breakHold.then(r); else r(); }, ms * FAST));    // no extra turn of the event loop when nobody is on a break
const DAY_LIMIT_MIN = 25, REWARD_EVERY = 5, PLAY_EVERY = 25;

/* ---------- the children: each has a door, a world and a save ---------- */
const PROFILES = {
  marie: { name: "Marie", theme: "cafe", world: "Kitty Café", old: "kittyBlocks.progress", streakNeed: 4 },
  kennedy: { name: "Kennedy", theme: "castle", world: "Knight Castle", old: "kidsMaths.kennedy", streakNeed: 3 }   // streakNeed: same as the engine's streakNeed
};
/* ?try=marie or ?try=kennedy: a parent preview of the play world. It uses its own practice save with spare coins,
   so the children's real saves are never touched. */
const TRY = new URLSearchParams(location.search).get("try");
const SAVE_KEY = w => "kidsMaths.game." + (TRY ? "try_" : "") + w;
const LOG_KEY = w => "kidsMaths.game.log." + (TRY ? "try_" : "") + w;       // the answer log is kept apart from the save (answer_log.js)
let log = null;                                                              // the answer log of the child who is playing
let who = null, P = null, theme = "cafe";
/* The save lives in localStorage. game_save.js checks it, repairs it, keeps a copy of anything it cannot read, and never overwrites a damaged save. */
const store = (() => { try { const ls = window.localStorage; ls.getItem("kidsMaths.probe"); return ls; } catch (e) { return null; } })()
  || (() => { const m = {}; return { getItem: k => (k in m ? m[k] : null), setItem: (k, v) => { m[k] = String(v); }, removeItem: k => { delete m[k]; } }; })();
const storeIsReal = (() => { try { return window.localStorage === store; } catch (e) { return false; } })();
let saveBlocked = false, saveWarnAt = 0, pendingNotes = [], lastSaveOk = null, lastSaveAt = 0;   // lastSaveOk: null before the first save of this visit
/* first time: copy the old app's save (engine progress, house, coins), then keep our own key; the old key is never written */
function loadSave(w, forceFresh) {
  const r = GameSave.load({ storage: store, key: SAVE_KEY(w), who: w, now: Date.now(), makeEngine: KidsEngine.createState, forceFresh: !!forceFresh,
    importOld() {
      let old = null; try { old = JSON.parse(store.getItem(PROFILES[w].old) || "null"); } catch (e) {}
      if (!old || typeof old !== "object" || Array.isArray(old)) old = null;
      const p = Object.assign({}, old || {});
      p.importedFrom = old ? PROFILES[w].old : "";
      p.coins = w === "marie" ? Number(old && old.stars) || 0 : Number(old && old.coins) || 0;   // Marie's stars become her coins
      return p;
    } });
  saveBlocked = r.blocked || !!forceFresh;                 // a start that had to be redone never writes over the old save
  if (!storeIsReal) r.notes.push("This browser is not letting the game keep saved progress. Maths still works, but it will be forgotten when this page closes.");
  r.notes.forEach(t => GameSave.addNote(store, w, t, Date.now()));
  pendingNotes = r.notes;
  return r.p;
}
/* a plain-words warning for the grown-up when a save did not work; it goes away when a save works again */
function saveWarn(text) {
  const now = Date.now(); if (document.getElementById("savewarn") || now - saveWarnAt < 300000) return;
  saveWarnAt = now;
  const d = document.createElement("div"); d.id = "savewarn"; d.setAttribute("role", "alert");
  d.innerHTML = `<span>Grown-up note: ${text}</span><button aria-label="I have read this">OK</button>`;
  d.querySelector("button").onclick = () => d.remove();
  document.body.appendChild(d);
}
function save() {
  if (!who) return true;
  if (saveBlocked) { saveWarn("this play is not being saved, so the earlier saved progress stays safe. A grown-up should look at the game before the next play."); return false; }
  const r = GameSave.write(store, SAVE_KEY(who), P);
  lastSaveOk = !!r.ok; if (r.ok) lastSaveAt = Date.now();
  if (!r.ok) { saveWarn("this device could not save the progress. Please do not close this page. Check that the browser allows saving and is not in a private window."); return false; }
  const w = document.getElementById("savewarn"); if (w) w.remove();
  return true;
}
const dayKey = t => KidsEngine.dayKey(t);
function dayLog() {
  const d = dayKey(Date.now());
  const k = Object.keys(P.days); if (k.length > 60) delete P.days[k.sort()[0]];   // keep 60 days
  return P.days[d] || (P.days[d] = { n: 0, clean: 0, ms: 0, sets: 0, skills: {} });
}
let lastAct = Date.now();
function addTime() { const t = Date.now(); dayLog().ms += Math.min(120000, Math.max(0, t - lastAct)); lastAct = t; }
const overLimit = () => dayLog().ms >= (P.limitMin || DAY_LIMIT_MIN) * 60000;

/* ---------- skills: only those with a story question are played; the engine skips the rest ---------- */
const M = KidsEngine.buildSkillMap((window.MathTopics || []).filter(t => t.id === "kinder"), KS.extraSkills());   // + the Stage 3 story kinds
M.order.forEach(id => { M.map[id].ready = KS.SKILLS.includes(id); });
M.order.forEach(id => { M.map[id].needs = M.map[id].needs.filter(n => M.map[n] && M.map[n].ready); });   // a need with no game cannot lock a skill

/* ---------- themes: colours live in theme.css ---------- */
document.body.dataset.theme = theme;
if (window.KittyChars) KittyChars.injectCss();
if (window.KnightArt) KnightArt.injectCss();
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();
const art = (pose, t = theme) => t === "cafe" ? KittyChars.full("kitty", pose) : KnightArt.full("knight", pose);
/* the hopper on the number line: Mimi's face or the knight's helmet, cropped from the same pictures as the rest of the game */
const PAWN = { cafe: { src: "rewards/art/cafe/mimi_stand.png", box: "62 22 336 336" }, castle: { src: "rewards/art/castle/knight_idle.png", box: "66 6 330 330" } };
Object.values(PAWN).forEach(p => { const im = new Image(); im.src = p.src; });
const pawnSvg = (x, y, size) => { const p = PAWN[theme] || PAWN.cafe;
  return `<svg x="${x}" y="${y}" width="${size}" height="${size}" viewBox="${p.box}" class="pawn"><image href="${p.src}" xlink:href="${p.src}" width="462" height="600"/></svg>`; };
function mascot(pose) { const m = $("#mascot"); if (m) m.innerHTML = art(pose); }
function setTheme(t) { theme = t === "castle" ? "castle" : "cafe"; document.body.dataset.theme = theme; mascot("stand"); buildTools(); }

/* ---------- voice: recorded natural voice (voice/<hash>.mp3). A sentence is played whole when recorded;
   otherwise it is played in pieces (text around the numbers, and each number), all recorded with the same voice. ---------- */
function fnv(text) {
  const bytes = new TextEncoder().encode(text); let h = 0x811c9dc5;
  for (const by of bytes) { h ^= by; h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, "0");
}
let actx = null, voiceList = null, playing = null, sayToken = 0, manifestPromise = null, manifestFailedAt = 0;
/* the list of recorded clips: tried up to 3 times; if it still fails the system voice speaks, and a later say() tries again (at most every 20 s) */
function loadManifest(tries = 3) {
  return manifestPromise = (async () => {
    for (let i = 0; i < tries; i++) {
      try { const r = await fetch("voice/manifest.json"); if (r.ok) { const m = await r.json(); if (m && typeof m === "object" && !Array.isArray(m)) { voiceList = m; manifestFailedAt = 0; return true; } } } catch (e) {}
      if (i < tries - 1) await new Promise(res => setTimeout(res, 500 * (i + 1) * FAST));
    }
    voiceList = voiceList || {}; manifestFailedAt = Date.now(); return false;
  })();
}
if (window.__noVoice) voiceList = {}; else loadManifest();
function audioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  if (!actx) actx = new AC();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
const has = text => !!(voiceList && voiceList[fnv(text)]);
const buffers = {};
async function fetchClip(h, ctx) {
  const r = await fetch(`voice/${h}.mp3`); if (!r.ok) throw new Error("clip " + r.status);
  const b = await r.arrayBuffer();
  return new Promise((ok, no) => ctx.decodeAudioData(b, ok, no));
}
async function clip(text) {                      // a failed clip is tried once more; only a good clip is kept
  const h = fnv(text), ctx = audioCtx();
  if (!ctx || !has(text)) return null;
  for (let attempt = 0; attempt < 2; attempt++) {
    if (!buffers[h]) buffers[h] = fetchClip(h, ctx);
    try { return await buffers[h]; } catch (e) { delete buffers[h]; if (!attempt) await new Promise(res => setTimeout(res, 300 * FAST)); }
  }
  return null;
}
const player = new Audio(); player.preload = "auto";   // where Web Audio is missing; unlocked on the first tap
let unlocked = false;
document.addEventListener("pointerdown", () => {
  audioCtx();
  if (!unlocked && !(window.AudioContext || window.webkitAudioContext)) {
    unlocked = true; player.muted = true; player.src = `voice/${fnv("0")}.mp3`;
    const p = player.play(); if (p) p.then(() => { player.pause(); player.muted = false; }).catch(() => { player.muted = false; });
  }
}, true);
function stopVoice() { sayToken++; try { if (playing) playing.stop(); } catch (e) {} playing = null; try { player.pause(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} }
/* one recorded clip. Resolves true when it played (or was cut short on purpose), false when it could not be played */
async function playOne(text, me) {
  if (!(window.AudioContext || window.webkitAudioContext)) {
    const once = () => new Promise(res => {
      player.muted = false; player.src = `voice/${fnv(text)}.mp3`; player.onended = () => res(true); player.onerror = () => res(false);
      const p = player.play(); if (p) p.catch(() => res(false));
      setTimeout(() => res(true), (600 + text.length * 62) * 2);
    });
    return (await once()) || (me !== sayToken) || await once();
  }
  const buf = await clip(text);
  if (me !== sayToken) return true;
  if (!buf) return false;
  return new Promise(res => {
    const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination); playing = src;
    src.onended = () => res(true); src.start(); setTimeout(() => res(true), buf.duration * 1000 + 300);
  });
}
const piecesOf = text => text.split(/(\d+)/).map(s => s.trim()).filter(s => /[a-z0-9]/i.test(s));   // a lone full stop is not spoken
function speakSystem(text) {                     // the voice of the device: used when there is no recording, or a recording failed
  const est = 600 + text.length * 62;
  try {
    if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(text.replace(/−/g, " minus "));
      u.lang = "en-US"; u.rate = .95;
      const v = speechSynthesis.getVoices().find(v => /^en/i.test(v.lang) && /Samantha|Ava|Karen|Daniel|Google/i.test(v.name)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
  return new Promise(r => setTimeout(r, est * FAST));
}
/* Warm the voice pieces of a text before they are needed (plan item 25, review item 28): a long number sentence is joined from about five clips,
   and each clip used to be fetched only when its turn came, so a slow link left gaps. Now every piece is asked for at once, as soon as a question
   appears, and kept (decoded where there is Web Audio, in the browser cache where there is not). */
const warmDone = new Set();
function warmText(text) {
  text = String(text || "").trim(); if (!text || warmDone.has(text)) return;
  const parts = has(text) ? [text] : (() => { const ps = piecesOf(text); return ps.length > 1 && ps.every(has) ? ps : []; })();
  if (!parts.length) return;
  warmDone.add(text); if (warmDone.size > 600) warmDone.clear();
  parts.forEach(t => {
    if (window.__warmLog) window.__warmLog.push(t);                // tests only
    if (window.AudioContext || window.webkitAudioContext) clip(t).catch(() => {}); else fetch(`voice/${fnv(t)}.mp3`).catch(() => {});
  });
}
async function warmQuestion(q, me) {
  if (window.__noVoice || !q) return;
  if (voiceList === null && manifestPromise) await Promise.race([manifestPromise, new Promise(r => setTimeout(r, 1500))]);
  if (!voiceList) return;
  warmText(q.say);                                                  // the question first, at once
  const later = () => {
    if (me && QS !== me) return;
    [q.correct, q.fact, q.hint].forEach(warmText);
    (q.opts || []).forEach(o => warmText(q.picOpts && q.optSay ? q.optSay[o] : String(o)));      // what Kennedy hears when he taps
    if (!q.parent && q.skill) { try { KS.teach(q, false).steps.forEach(st => warmText(st.say)); } catch (e) {} }   // the lesson after a miss
  };
  setTimeout(later, 400);
}
async function say(text) {
  text = String(text); stopVoice(); let me = sayToken;
  if (window.__sayLog) window.__sayLog.push(text);                  // tests only: what was spoken
  if (voiceList === null && manifestPromise) {   // the list is still loading: give it a moment, so the recorded voice is used
    await Promise.race([manifestPromise, new Promise(r => setTimeout(r, 1500))]);
    if (me !== sayToken) return;
  } else if (manifestFailedAt && Date.now() - manifestFailedAt > 20000 && !window.__noVoice) loadManifest(1);   // try the list again in the background
  if (has(text)) {
    warmText(text);
    if (await playOne(text, me)) return;
    if (me !== sayToken) return;
    return speakSystem(text);                    // the clip failed twice: never go silent
  }
  const parts = piecesOf(text);
  if (parts.length > 1 && parts.every(has)) {
    warmText(text);                                                 // every piece is asked for now, not one by one
    for (let i = 0; i < parts.length; i++) {
      if (me !== sayToken) return;
      if (!(await playOne(parts[i], me))) { if (me !== sayToken) return; return speakSystem(parts.slice(i).join(" ")); }
    }
    return;
  }
  return speakSystem(text);
}
function chime() {
  const ctx = audioCtx(); if (!ctx) return;
  [[660, 0], [880, .14]].forEach(([f, t]) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, ctx.currentTime + t); g.gain.linearRampToValueAtTime(.1, ctx.currentTime + t + .03);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .6);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .65);
  });
}

/* ---------- drawings (our own) ---------- */
const ICON = {

};
const PENS = [["#2c3e50", "#1c2833"], ["#2f80ed", "#1f5fb8"], ["#27ae60", "#1b7f45"], ["#e74c3c", "#b8382b"], ["#f39c12", "#c27a08"], ["#9b51e0", "#7438ad"]];
let svgId = 0;
const heart = (x, y, r, fill) => `<path d="M${x} ${y + r * .9} C${x - r * 1.6} ${y - r * .2} ${x - r * .7} ${y - r * 1.3} ${x} ${y - r * .45} C${x + r * .7} ${y - r * 1.3} ${x + r * 1.6} ${y - r * .2} ${x} ${y + r * .9}Z" fill="${fill}"/>`;
const star = (x, y, r, fill) => `<path d="${Array.from({ length: 10 }, (_, k) => { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; return `${k ? "L" : "M"}${(x + Math.cos(a) * rr).toFixed(1)} ${(y + Math.sin(a) * rr).toFixed(1)}`; }).join("")}Z" fill="${fill}"/>`;
function pencilSVG(col, dark, down) {
  const L = 112, W = 34, id = "pg" + (++svgId);
  const cx = down ? 17 : 62, cy = down ? L - 62 : 17;
  const charm = theme === "castle" ? star(cx, cy, 6, "#ffe08a") : heart(cx, cy, 5.5, "#ffffff");
  return `<svg viewBox="${down ? `0 0 ${W} ${L}` : `0 0 ${L} ${W}`}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">

  if (window.__noWorld || !window.PlayWorlds || !PlayWorlds.has(theme)) return;
  P.world = P.world || {};
  let host = null;
  try {
    const opening = PlayWorlds.open(document.body, { theme, minutes: 5, fast: !!window.__demoFast, speak: say, data: P.world, kid: KidMode.on(),
      keepsakes: Journey.keepsakeList(P.keepsakes).map(k => ({ src: k.src, label: k.label })),
      getCoins: () => P.coins, spendCoins: n => { if (P.coins < n) return false; P.coins -= n; drawCoins(true); return true; }, save });
    host = document.querySelector(".pw-host"); if (host) FocusGuard.enter(host, { label: "Play world", trap: true });
    await opening;
  } catch (e) { console.error(e); }
  if (host) FocusGuard.leave(host, "#tile");
  drawCoins(false); lastAct = Date.now();
}
/* a break: a picture button in the tools. A quiet card waits as long as the child likes; the time is logged for the grown-up, and is not counted as thinking or play time */
async function takeBreak() {
  if (breakHold || document.querySelector(".over") || !who) return;
  const started = Date.now(), me = QS; let release;
  breakHold = new Promise(r => { release = r; });
  addTime(); stopVoice();
  try { await journeyCard("break"); } finally { release(); breakHold = null; }
  const ms = Date.now() - started, d = dayLog();
  d.breaks = (d.breaks || 0) + 1; d.breakMs = (d.breakMs || 0) + ms;
  lastAct = Date.now(); if (me) me.t0 += ms;
  save();
  if (QS && QS === me && me.phase === "ask" && !me.teaching && !me.submitting) say(Q.say);       // the question is read again
}
/* the end of the day: stars, coins held and what is being saved for (the day is over by the clock) */
async function dayEnd() {
  QS = null; stopVoice(); closeBoard(); save(); if (window.QuestScene) QuestScene.react("end");
  const d = dayLog(), info = worldInfo(), kid = KidMode.on();
  const html = Journey.dayCard({ theme, kid, stars: d.clean, coins: P.coins, want: info && info.want, canBuy: !!(info && info.canBuy), stones: pathStones(), total: PLAY_EVERY / REWARD_EVERY, mascot: art("happy"), coinSvg: ICON.coin });
  const shown = overlay(html, "jover"); let open = true; shown.then(() => { open = false; });
  (async () => { await say(Journey.lineFor("day", theme)); if (open) await say(Journey.lineFor("day2", theme)); })();
  await shown; stopVoice();
  doors();
}
function band(kind) {
  const b = document.createElement("div"); b.className = "band " + kind;
  b.innerHTML = `${art("happy")}<span>Correct!</span>`;
  document.body.appendChild(b); setTimeout(() => b.remove(), 1350);
}
/* three steps of help (hint_ladder.js): 1 a nudge, 2 a picture of the story, 3 the worked step. Only step 3 counts as help for the maths level, and no step costs coins. */
function openHint(level) {
  closeHint(); if (!QS || !Q) return;
  const asking = QS.phase === "ask";
  const lvl = Math.max(1, Math.min(3, level || QS.hintLevel || 1));
  if (asking) { QS.hintLevel = Math.max(QS.hintLevel, lvl); QS.hinted = true; }
  const pic = lvl >= 2 ? HintLadder.picture(Q) : null;
  const text = lvl === 1 ? HintLadder.nudge(Q) : lvl === 2 ? (pic ? pic.caption : HintLadder.CAPTION_SCENE) : Q.hint;
  const more = lvl < 3 ? `<button class="hmore" aria-label="More help">${KidMode.on() ? KidMode.ICONS.more : "More help"}</button>` : "";
  const h = document.createElement("div"); h.className = "bubble"; h.dataset.level = lvl;
  h.innerHTML = `<div class="bh"><button class="hsay" aria-label="Read the hint">${ICON.speaker}</button><h4>${text}</h4></div>${pic ? pic.svg : ""}${more}`;
  h.querySelector(".hsay").onclick = () => say(text);
  const mb = h.querySelector(".hmore"); if (mb) mb.onclick = () => openHint(lvl + 1);
  if (window.QuestScene) QuestScene.react("hint");
  $("#work").appendChild(h);
  document.querySelectorAll("#qbody .bulb").forEach(b => b.innerHTML = ICON.close);
  h.addEventListener("keydown", e => { if (e.key === "Escape") closeHint(); });
  FocusGuard.enter(h, { label: "Hint", first: h.querySelector(".hsay") });
  const me = QS;
  say(text).then(() => { if (QS === me && mb && lvl === 1) return kidPrompt("more", me); });
}
function closeHint() { document.querySelectorAll(".bubble").forEach(b => { b.remove(); FocusGuard.leave(b, "#qbody .bulb"); }); document.querySelectorAll("#qbody .bulb").forEach(b => b.innerHTML = ICON.bulb); }

/* ---------- drawing: pencil always ready, 6 colours, rubber, bin (no sounds) ---------- */
function buildTools() {
  const down = matchMedia(NARROW).matches;
  const kid = KidMode.on(), pens = kid ? PENS.slice(0, 1) : PENS;     // Kennedy: one pencil, the rubber, the bin and home
  $("#tools").innerHTML = pens.map(([c, d]) => `<button class="pencil" data-c="${c}" aria-label="Colour pencil">${pencilSVG(c, d, down)}</button>`).join("")
    + `<button class="rubber" data-t="erase" aria-label="Rubber">${rubberSVG(down)}</button><div class="grow"></div><button class="bin breakbtn" data-t="break" aria-label="Take a break">${Journey.ICON.moon}</button><button class="bin" data-t="clear" aria-label="Clear the drawing">${ICON.bin}</button><button class="bin home" data-t="home" aria-label="Back to the start">${ICON.home}</button>`;
  $("#tools").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.t === "clear") return clearDraw();
    if (b.dataset.t === "break") return takeBreak();
    if (b.dataset.t === "home") return KidMode.on() ? confirmHome() : doors();
    const pick = b.dataset.c || "erase"; pen = pen === pick ? null : pick; markTools();   // tap again to put the pen away: then a touch on the page does nothing
  });
  markTools();
}
/* Kennedy: the home button cannot end his session with one tap. A card with two pictures asks first, and says so out loud. */
async function confirmHome() {
  if (document.querySelector(".kidconfirm")) return;
  say(KidMode.promptText("home"));
  const v = await overlay(`<div class="panel kidconfirm"><h1 class="sr">Stop playing?</h1><div class="homepic">${ICON.home}</div><div class="pair"><button class="go" data-v="yes" aria-label="Yes, stop and go home">${KidMode.ICONS.tick}</button><button class="go" data-v="no" aria-label="No, keep playing">${KidMode.ICONS.cross}</button></div></div>`);
  stopVoice();
  if (v === "yes") doors();
}
function markTools() { $("#tools").querySelectorAll("button").forEach(b => { const on = pen !== null && (b.dataset.c || b.dataset.t) === pen; b.classList.toggle("on", on); if (b.dataset.c || b.dataset.t === "erase") b.setAttribute("aria-pressed", String(on)); }); }
let gd = null;
function sizeDraw() {
  const c = $("#draw"), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
  gd = c.getContext("2d"); gd.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function clearDraw() { const c = $("#draw"); if (gd) { gd.save(); gd.setTransform(1, 0, 0, 1, 0, 0); gd.clearRect(0, 0, c.width, c.height); gd.restore(); } }
function setupDraw() {
  /* The drawing layer never sits on top of a button. #draw ignores touches (pointer-events: none), so every button, answer and
     key gets its own tap first. Only a touch that lands on empty space starts a stroke, and #work (the parent of both) listens for it.
     A finger tap on empty space leaves no dot; a stroke needs a little movement. A pen or mouse still marks a dot at once. */
  const c = $("#draw"), w = $("#work"); let last = null, id = null, moved = false, fromX = 0, fromY = 0;
  const SKIP = "button, a, input, select, textarea, label, [role=button], .opt, .box, .tapitem, .tapbox, .nlbox, .hoprow, .counttray, .bulb, .keys, #pad, #tools, #boardbtns";
  const at = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const style = () => { const er = pen === "erase"; gd.globalCompositeOperation = er ? "destination-out" : "source-over";
    gd.strokeStyle = er ? "#000" : pen; gd.fillStyle = gd.strokeStyle; gd.lineWidth = er ? 30 : 5; gd.lineCap = gd.lineJoin = "round"; };
  w.addEventListener("pointerdown", e => {
    if (!gd || pen === null || id !== null || (e.target.closest && e.target.closest(SKIP))) return;
    id = e.pointerId; moved = false; last = at(e); fromX = e.clientX; fromY = e.clientY;
    try { w.setPointerCapture(e.pointerId); } catch (x) {}
    if (e.pointerType !== "touch") { style(); gd.beginPath(); gd.arc(last[0], last[1], gd.lineWidth / 2, 0, 7); gd.fill(); moved = true; }
  });
  w.addEventListener("pointermove", e => {
    if (e.pointerId !== id || !last) return;
    if (!moved && Math.hypot(e.clientX - fromX, e.clientY - fromY) < 6) return;     // a finger that only taps draws nothing
    e.preventDefault(); const p = at(e); style();
    if (!moved) { gd.beginPath(); gd.arc(last[0], last[1], gd.lineWidth / 2, 0, 7); gd.fill(); moved = true; }
    gd.beginPath(); gd.moveTo(last[0], last[1]); gd.lineTo(p[0], p[1]); gd.stroke(); last = p;
  });
  const end = e => { if (e.pointerId === id) { id = null; last = null; } };
  w.addEventListener("pointerup", end); w.addEventListener("pointercancel", end);
}

/* ---------- cards ---------- */
function overlay(html, cls = "") {
  return new Promise(res => {
    const o = document.createElement("div"); o.className = ("over " + cls).trim(); o.innerHTML = html; document.body.appendChild(o);
    const h = o.querySelector("h1"); if (h) { h.id = "ovh" + (++svgId); o.setAttribute("aria-labelledby", h.id); }
    FocusGuard.enter(o, { label: h ? "" : "Message", trap: true, first: cls.includes("start") ? o : undefined });   // the doors: focus the card (a screen reader reads its title), no ring on one child's door
    o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true");
    o.querySelectorAll("button").forEach(b => b.onclick = () => { o.remove(); FocusGuard.leave(o, "#tile"); res(b.dataset.v); });
  });
}
async function showEnd(title, text) {
  QS = null; stopVoice(); closeBoard(); save(); if (window.QuestScene) QuestScene.react("end");
  say(`${title} ${text}`);
  await overlay(`<div class="panel"><div class="mascot-big">${art("happy")}</div><h1>${title}</h1><p>${text}</p>${KidMode.on() ? `<button class="go pictureok" aria-label="OK">${KidMode.ICONS.tick}</button>` : `<button class="go">OK</button>`}</div>`);
  doors();
}
/* a plain-words note for the grown-up: shown once when something about a save needed care, and kept until it is read */
async function parentNote(lines) {
  await overlay(`<div class="panel parentnote"><h1>Note for a grown-up</h1>${lines.map(t => `<p>${t}</p>`).join("")}<button class="go" data-v="ok">I have read this</button></div>`);
  GameSave.clearNotes(store, lines);
}
/* the card for grown-ups: a check first, then the report, the downloads and the progress file (parent_area.js) */
function openGrownups() {
  return ParentArea.open({ store, saveKey: w => SAVE_KEY(w), logKey: w => LOG_KEY(w), names: { marie: PROFILES.marie.name, kennedy: PROFILES.kennedy.name }, M,
    KidsEngine, GameSave, AnswerLog, ProgressFile, ParentReport, MissStudy, FocusGuard, DeviceStatus, CountingNeed,
    device: () => DeviceStatus.collect({ navigator, caches: window.caches, saveBlocked: saveBlocked || lastSaveOk === false, standalone: matchMedia("(display-mode: standalone)").matches || navigator.standalone === true }) });
}
/* Marie's counting skills: the grown-up's choice (auto, on, off: counting_need.js) and what her answer record says.
   When they are on, both skills go on her focus list, so the engine asks them in order (up to 20, then up to 50). A grown-up note is left once when the record turned them on. */
function countingFor(w) {
  if (w !== "marie" || !P) return { on: false, why: "none" };
  const st = P.engine, pref = CountingNeed.read(store);
  const d = CountingNeed.decide(pref.mode, log ? log.all() : [], CountingNeed.learning(st, KidsEngine.LV.KNOWS));
  if (!Array.isArray(st.focus)) st.focus = [];
  if (d.on) CountingNeed.IDS.forEach(id => { if (!st.focus.includes(id)) st.focus.push(id); });
  else st.focus = st.focus.filter(id => !CountingNeed.IDS.includes(id));
  if (d.on && d.why === "record" && !pref.noted) {
    CountingNeed.write(store, { noted: true });
    const t = `${PROFILES[w].name} made a few counting slips lately (answers one or two away). Counting practice by tapping was added to her questions. You can change this in For grown-ups.`;
    GameSave.addNote(store, w, t, Date.now());                  // shown on the doors card for a grown-up, not to the child
  }
  return d;
}
/* the doors: each child taps their own picture; no other choice */
async function doors() {
  stopVoice(); closeBoard(); closeHint(); save(); QS = null; who = null; P = null; KidMode.set(null); if (window.QuestScene) QuestScene.clear(); $("#homebadge").innerHTML = "";
  document.querySelectorAll(".over, .rewardhost").forEach(o => o.remove());
  const door = w => `<button class="go" data-theme="${PROFILES[w].theme}" data-v="${w}"><span class="art">${art("wave", PROFILES[w].theme)}</span>${PROFILES[w].name}<small>${PROFILES[w].world}</small></button>`;
  for (;;) {
    const notes = GameSave.notes(store);
    const note = notes.length ? `<div class="grownote" role="status"><b>Note for a grown-up</b>${notes.map(n => `<p>${n.text}</p>`).join("")}<button class="go small" data-v="__clear">I have read this</button></div>` : "";
    const w = await overlay(`<div class="panel"><h1>Kids Maths</h1><p>Tap your picture.</p><div class="pick">${door("marie")}${door("kennedy")}</div>${note}<button class="linkbtn" data-v="__grownups">For grown-ups</button></div>`, "start");
    if (w === "__clear") { GameSave.clearNotes(store); continue; }
    if (w === "__grownups") { await openGrownups(); continue; }
    return start(w);
  }
}
async function start(w, forceFresh) {
  who = PROFILES[w] ? w : "marie"; pen = null; set = null; si = 0; prevKey = ""; lastAct = Date.now();
  try {
    P = loadSave(who, forceFresh);
    log = AnswerLog.open({ storage: store, key: LOG_KEY(who) });
    if (log.damaged) { const t = `${PROFILES[who].name}'s record of answers was damaged. A safe copy was kept on this device and a new record started. Play and progress are not affected.`; GameSave.addNote(store, who, t, Date.now()); pendingNotes.push(t); }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});      // ask the browser to keep the save (Safari may clear it after a week otherwise)
    KidMode.set(who); setTheme(PROFILES[who].theme); audioCtx(); sizeDraw(); save(); updateBadge();
    const counting = countingFor(who);                           // Marie's optional counting-by-tapping skills (counting_need.js): on only when a grown-up asks or the record shows slips
    M.order.forEach(id => { M.map[id].ready = KS.SKILLS.includes(id) && KS.fits(id, theme) && (!KS.optional(id) || counting.on); });   // cafe kinds are Marie's, knight kinds Kennedy's
    if (pendingNotes.length) { const n = pendingNotes; pendingNotes = []; await parentNote(n); }
    if (P.engine.paused) return showEnd("Maths is resting.", "A grown-up paused maths for now.");
    if (overLimit()) return dayEnd();
    nextQuestion();
  } catch (e) {
    console.error(e);
    /* the save made the game stumble: keep a copy, start fresh once; if that fails too, show a plain card, never a blank screen */
    if (!forceFresh) return start(w, true);
    await overlay(`<div class="panel"><h1>Something went wrong</h1><p>The game could not start. Nothing was lost. A grown-up can tell Dad. Tap the button to go back.</p><button class="go">Back</button></div>`);
    doors();
  }
}

/* ---------- start ---------- */
$("#speak").innerHTML = ICON.speaker; $("#speak").onclick = () => QS && say(Q.say);
$("#tile").onclick = tile;
buildTools(); buildPad(); setupDraw(); if (window.QuestScene) QuestScene.mount($("#scene"));
let wasNarrow = matchMedia(NARROW).matches;
addEventListener("resize", () => {
  const nw = matchMedia(NARROW).matches; if (nw !== wasNarrow) { wasNarrow = nw; buildTools(); }
  buildPad(); sizeDraw(); if (QS) renderBody();
});
addEventListener("pagehide", save);
requestAnimationFrame(sizeDraw);
drawDots(); mascot("stand");
if (TRY && PROFILES[TRY]) { start(TRY); P.coins = Math.max(P.coins, 300); save(); drawCoins(false); playWorld(); } else doors();
/* offline use (plan item 22): the helper in sw.js saves the game on this device after one visit. Not registered under the automatic tests (they stub the page), unless a test sets window.__swTest. */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && (!navigator.webdriver || window.__swTest)) {
  const register = () => navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(e => console.warn("offline helper not started", e));
  if (document.readyState === "complete") register(); else addEventListener("load", register);
  /* a page that was opened before an update is still the old page: when a new helper takes over, load the new files once (saves are kept on the device) */
  const hadHelper = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadHelper && !reloaded && !(QS && QS.teaching)) { reloaded = true; location.reload(); } });
}
window.__game = { make: pickQuestion, get fam() { return P && P.game.fam; }, get Q() { return Q; }, get log() { return log; }, hint: openHint, grownups: openGrownups, get saveBlocked() { return saveBlocked; }, get QS() { return QS; }, get P() { return P; }, get set() { return set; }, M, start, doors,
  show(q) { nextQuestion(q); },
  lesson() { if (!Q) return; closeBoard(); QS.tries = 1; return teach(); },
  ask(skill, a, b, op) {                            // tests: show one exact sum, e.g. ask("sums.7", 47, 38, "+")
    const tpl = KS.templates(theme).find(t => KS.usable(t, skill, op)); if (!tpl) throw new Error("no story for " + skill);
    nextQuestion(KS.build(skill, theme, tpl, a, b)); } };
