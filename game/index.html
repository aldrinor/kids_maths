<!doctype html>

<!-- Kids Maths game (21 Oct 2026). Plan: 16_kids_maths/kids_maths_game_plan_2026-10-21.md.
     - Two doors: Marie (Kitty Cafe) and Kennedy (Knight Castle). No topic choosing: the learning engine
       (../modules/engine.js) picks every question, finds the level, moves up when secure, practises again on a slip.
     - Every question is a story (stories.js). The question screen is the agreed demo screen (../demo).
     - Coins for right answers. Every 5 answers a short reward game (game/rewards/: Mimi's Hot Chocolate, Ice Cream and Cookies in turn for Marie, Pony Stable, Goblin Rescue and Tower for Kitty in turn for Kennedy). Every 25 answers: play world (stage 2).
     - Own save per child (kidsMaths.game.<child>); the old app's save is read once and never written. -->
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">
  <div id="deco"></div>
  <div id="rotate" role="alert"><div><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="32" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M8 30a16 16 0 0 0 10 12M40 18A16 16 0 0 0 30 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><p>Please turn the phone upright.</p></div></div>
  <div id="top"><button id="speak" aria-label="Read the question out loud"></button><div id="dots" aria-label="Questions until the next game"></div><div id="msg" role="status" hidden></div><div id="coins" aria-label="Coins"></div><div id="mascot" aria-hidden="true"></div></div>
  <div id="tools"></div>
  <div id="work"><canvas id="draw"></canvas><div id="qbody"></div></div>
  <div id="keys"><div id="pad"></div></div>
  <button id="tile" hidden><span>Check</span></button>
</div>
<script src="../modules/characters.js"></script>
<script src="../modules/knight_art.js"></script>
<script src="../modules/engine.js"></script>
<script src="../topics/kinder.js"></script>
<script src="stories.js"></script>
<!-- reward games (game/rewards/): the shared core and kits, then one file per game -->
<link rel="stylesheet" href="rewards/reward_styles.css">
<script src="rewards/reward_kit_spring.js"></script>
<script src="rewards/reward_kit_drag.js"></script>
<script src="rewards/reward_kit_sound.js"></script>

<script src="rewards/cafe_ice_cream.js"></script>

<script src="rewards/castle_pony_stable.js"></script>
<script src="rewards/castle_extra_art.js"></script>
<script src="rewards/castle_goblin_rescue.js"></script>
<script src="rewards/castle_kitty_tower.js"></script>
<script src="world/world_core.js"></script>
<!-- play worlds: world/cafe_world.js and world/castle_world.js are added when built -->
<script src="world/cafe_world.js"></script>
<script src="world/castle_world.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const FAST = window.__demoFast ? 0.2 : 1;            // tests run the teaching faster
const wait = ms => new Promise(r => setTimeout(r, ms * FAST));
const DAY_LIMIT_MIN = 25, REWARD_EVERY = 5, PLAY_EVERY = 25, AUTO_NEXT_MS = 4000;

/* ---------- the children: each has a door, a world and a save ---------- */
const PROFILES = {
  marie: { name: "Marie", theme: "cafe", world: "Kitty Café", old: "kittyBlocks.progress" },
  kennedy: { name: "Kennedy", theme: "castle", world: "Knight Castle", old: "kidsMaths.kennedy" }
};
/* ?try=marie or ?try=kennedy: a parent preview of the play world. It uses its own practice save with spare coins,
   so the children's real saves are never touched. */
const TRY = new URLSearchParams(location.search).get("try");
const SAVE_KEY = w => "kidsMaths.game." + (TRY ? "try_" : "") + w;
let who = null, P = null, theme = "cafe";
/* first time: copy the old app's save (engine progress, house, coins), then keep our own key; the old key is never written */
function loadSave(w) {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(SAVE_KEY(w)) || "null"); } catch (e) {}
  if (!p) {
    let old = null; try { old = JSON.parse(localStorage.getItem(PROFILES[w].old) || "null"); } catch (e) {}
    p = Object.assign({}, old || {});
    p.importedFrom = old ? PROFILES[w].old : "";
    p.coins = w === "marie" ? Number(old && old.stars) || 0 : Number(old && old.coins) || 0;   // Marie's stars become her coins
  }
  p.game = Object.assign({ answered: 0, sinceReward: 0, sincePlay: 0, rewardTurn: 0 }, p.game || {});
  if (!p.engine || p.engine.profile !== w) p.engine = KidsEngine.createState(w);
  if (!p.days || typeof p.days !== "object") p.days = {};
  if (!Number.isFinite(p.coins)) p.coins = 0;
  return p;
}
function save() { if (!who) return; try { localStorage.setItem(SAVE_KEY(who), JSON.stringify(P)); } catch (e) {} }
const dayKey = t => KidsEngine.dayKey(t);
function dayLog() {
  const d = dayKey(Date.now());
  const k = Object.keys(P.days); if (k.length > 60) delete P.days[k.sort()[0]];   // keep 60 days
  return P.days[d] || (P.days[d] = { n: 0, clean: 0, ms: 0, sets: 0, skills: {} });
}
let lastAct = Date.now();
function addTime() { const t = Date.now(); dayLog().ms += Math.min(120000, Math.max(0, t - lastAct)); lastAct = t; }
const overLimit = () => dayLog().ms >= (P.limitMin || DAY_LIMIT_MIN) * 60000;

/* ---------- skills: only those with a story question are played; the engine skips the rest ---------- */
const M = KidsEngine.buildSkillMap((window.MathTopics || []).filter(t => t.id === "kinder"), KS.extraSkills());   // + the Stage 3 story kinds
M.order.forEach(id => { M.map[id].ready = KS.SKILLS.includes(id); });
M.order.forEach(id => { M.map[id].needs = M.map[id].needs.filter(n => M.map[n] && M.map[n].ready); });   // a need with no game cannot lock a skill

/* ---------- themes: colours live in theme.css ---------- */
document.body.dataset.theme = theme;
if (window.KittyChars) KittyChars.injectCss();
if (window.KnightArt) KnightArt.injectCss();
const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();
const art = (pose, t = theme) => t === "cafe" ? KittyChars.full("kitty", pose) : KnightArt.full("knight", pose);
const faceArt = () => theme === "cafe" ? KittyChars.face("kitty") : KnightArt.face("knight");
function mascot(pose) { const m = $("#mascot"); if (m) m.innerHTML = art(pose); }
function setTheme(t) { theme = t === "castle" ? "castle" : "cafe"; document.body.dataset.theme = theme; mascot("stand"); buildTools(); }

/* ---------- voice: recorded natural voice (voice/<hash>.mp3). A sentence is played whole when recorded;
   otherwise it is played in pieces (text around the numbers, and each number), all recorded with the same voice. ---------- */
function fnv(text) {
  const bytes = new TextEncoder().encode(text); let h = 0x811c9dc5;
  for (const by of bytes) { h ^= by; h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, "0");
}
let actx = null, voiceList = null, playing = null, sayToken = 0;
if (window.__noVoice) voiceList = {};      // tests: check the words, not the recordings
else fetch("voice/manifest.json").then(r => r.ok ? r.json() : {}).then(m => voiceList = m).catch(() => voiceList = {});
function audioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  if (!actx) actx = new AC();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
const has = text => !!(voiceList && voiceList[fnv(text)]);
const buffers = {};
async function clip(text) {
  const h = fnv(text), ctx = audioCtx();
  if (!ctx || !has(text)) return null;
  if (!buffers[h]) buffers[h] = fetch(`voice/${h}.mp3`).then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => ctx.decodeAudioData(b, ok, no)));
  try { return await buffers[h]; } catch (e) { return null; }
}
const player = new Audio(); player.preload = "auto";   // where Web Audio is missing; unlocked on the first tap
let unlocked = false;
document.addEventListener("pointerdown", () => {
  audioCtx();
  if (!unlocked && !(window.AudioContext || window.webkitAudioContext)) {
    unlocked = true; player.muted = true; player.src = `voice/${fnv("0")}.mp3`;
    const p = player.play(); if (p) p.then(() => { player.pause(); player.muted = false; }).catch(() => { player.muted = false; });
  }
}, true);
function stopVoice() { sayToken++; try { if (playing) playing.stop(); } catch (e) {} playing = null; try { player.pause(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} }
async function playOne(text, me) {             // one recorded clip; resolves when it ends
  if (!(window.AudioContext || window.webkitAudioContext)) {
    return new Promise(res => {
      player.muted = false; player.src = `voice/${fnv(text)}.mp3`; player.onended = () => res();
      const p = player.play(); if (p) p.catch(() => res());
      setTimeout(res, (600 + text.length * 62) * 2);
    });
  }
  const buf = await clip(text);
  if (me !== sayToken || !buf) return;
  return new Promise(res => {
    const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination); playing = src;
    src.onended = () => res(); src.start(); setTimeout(res, buf.duration * 1000 + 300);
  });
}
const piecesOf = text => text.split(/(\d+)/).map(s => s.trim()).filter(s => /[a-z0-9]/i.test(s));   // a lone full stop is not spoken
async function say(text) {
  text = String(text); stopVoice(); const me = sayToken;
  const est = 600 + text.length * 62;
  if (has(text)) return playOne(text, me);
  const parts = piecesOf(text);
  if (parts.length > 1 && parts.every(has)) { for (const p of parts) { if (me !== sayToken) return; await playOne(p, me); } return; }
  try {
    if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(text.replace(/−/g, " minus "));
      u.lang = "en-US"; u.rate = .95;
      const v = speechSynthesis.getVoices().find(v => /^en/i.test(v.lang) && /Samantha|Ava|Karen|Daniel|Google/i.test(v.name)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
  return new Promise(r => setTimeout(r, est * FAST));
}
function chime() {
  const ctx = audioCtx(); if (!ctx) return;
  [[660, 0], [880, .14]].forEach(([f, t]) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, ctx.currentTime + t); g.gain.linearRampToValueAtTime(.1, ctx.currentTime + t + .03);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .6);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .65);
  });
}

/* ---------- drawings (our own) ---------- */
const ICON = {
  speaker: `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  bulb: `<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V17h5.2v-1.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="#fff"/><rect x="9.4" y="18.2" width="5.2" height="2.4" rx="1" fill="#fff"/></svg>`,
  close: `<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`,
  play: `<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>`,
  bin: `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="7" width="12" height="14" rx="2"/><rect x="4" y="4" width="16" height="2.4" rx="1"/><rect x="9" y="2" width="6" height="2" rx="1"/></svg>`,
  home: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.5 11h2.8v9h5v-6h3.4v6h5v-9h2.8z"/></svg>`,
  coin: `<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#f6c945" stroke="#c99a1e" stroke-width="2.5"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#e3ad25" stroke-width="2"/><path d="M11 12.5 L16 8.5 L21 12.5 L19.2 20.5 H12.8 Z" fill="#fff3c4" opacity=".9"/></svg>`,
};
const PENS = [["#2c3e50", "#1c2833"], ["#2f80ed", "#1f5fb8"], ["#27ae60", "#1b7f45"], ["#e74c3c", "#b8382b"], ["#f39c12", "#c27a08"], ["#9b51e0", "#7438ad"]];
let svgId = 0;
const heart = (x, y, r, fill) => `<path d="M${x} ${y + r * .9} C${x - r * 1.6} ${y - r * .2} ${x - r * .7} ${y - r * 1.3} ${x} ${y - r * .45} C${x + r * .7} ${y - r * 1.3} ${x + r * 1.6} ${y - r * .2} ${x} ${y + r * .9}Z" fill="${fill}"/>`;
const star = (x, y, r, fill) => `<path d="${Array.from({ length: 10 }, (_, k) => { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; return `${k ? "L" : "M"}${(x + Math.cos(a) * rr).toFixed(1)} ${(y + Math.sin(a) * rr).toFixed(1)}`; }).join("")}Z" fill="${fill}"/>`;
function pencilSVG(col, dark, down) {
  const L = 112, W = 34, id = "pg" + (++svgId);
  const cx = down ? 17 : 62, cy = down ? L - 62 : 17;
  const charm = theme === "castle" ? star(cx, cy, 6, "#ffe08a") : heart(cx, cy, 5.5, "#ffffff");
  return `<svg viewBox="${down ? `0 0 ${W} ${L}` : `0 0 ${L} ${W}`}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".72"/><stop offset=".35" stop-color="${col}"/><stop offset="1" stop-color="${dark}"/></linearGradient>
    <linearGradient id="${id}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#b9c1ca"/><stop offset="1" stop-color="#8d96a1"/></linearGradient></defs>
    <g ${down ? `transform="translate(0 ${L}) rotate(-90)"` : ""}>
      <path d="M1 17 L12 13 L12 21 Z" fill="${col}"/>
      <path d="M12 12.5 Q22 6 32 3 L32 31 Q22 28 12 21.5 Z" fill="#f8dcae"/>
      <path d="M32 3 q-3 4 0 7 q-3 3.5 0 7 q-3 3.5 0 7 q-3 3.5 0 7" fill="none" stroke="#e7bf86" stroke-width="1.4"/>
      <rect x="31" y="2" width="62" height="30" rx="10" fill="url(#${id})"/>
      <rect x="36" y="6" width="52" height="4.5" rx="2.2" fill="#ffffff" opacity=".5"/>
      <rect x="91" y="2.5" width="9" height="29" rx="2" fill="url(#${id}m)"/>
      <path d="M94 3 V31 M97 3 V31" stroke="#ffffff" stroke-opacity=".6" stroke-width="1"/>
      <rect x="99" y="3.5" width="12" height="27" rx="6" fill="#f7a8bc"/>
      <rect x="101.5" y="6" width="6" height="4" rx="2" fill="#ffffff" opacity=".55"/>
    </g>${charm}
  </svg>`;
}
function rubberSVG(down) {
  const sleeve = css("--primary") || "#d9536f", cafe = theme !== "castle";
  const body = cafe ? "#f9b4c6" : "#fbf4e6", edge = cafe ? "#e48aa3" : "#d9ccb1", mark = cafe ? heart : star, markC = cafe ? "#ffffff" : "#ffe08a";
  const face = (x, y) => `<circle cx="${x - 7}" cy="${y}" r="2.6" fill="#4a3434"/><circle cx="${x + 7}" cy="${y}" r="2.6" fill="#4a3434"/>
      <path d="M${x - 4} ${y + 6} Q${x} ${y + 10} ${x + 4} ${y + 6}" stroke="#4a3434" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="${x - 11}" cy="${y + 7}" rx="3.2" ry="2" fill="#ff7f9c" opacity=".55"/><ellipse cx="${x + 11}" cy="${y + 7}" rx="3.2" ry="2" fill="#ff7f9c" opacity=".55"/>`;
  if (down) return `<svg viewBox="0 0 44 84" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <rect x="4" y="2" width="36" height="80" rx="12" fill="${body}" stroke="${edge}" stroke-width="2"/>
      <rect x="2" y="2" width="40" height="40" rx="7" fill="${sleeve}"/><rect x="2" y="2" width="40" height="8" rx="4" fill="#ffffff" opacity=".22"/>
      ${mark(22, 22, cafe ? 6.5 : 8, markC)}${face(22, 56)}</svg>`;
  return `<svg viewBox="0 0 84 44" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <rect x="2" y="4" width="78" height="36" rx="12" fill="${body}" stroke="${edge}" stroke-width="2"/>
      ${face(21, 17)}
      <rect x="40" y="2" width="42" height="40" rx="7" fill="${sleeve}"/><rect x="40" y="2" width="42" height="9" rx="4" fill="#ffffff" opacity=".22"/>
      ${mark(61, 23, cafe ? 6.5 : 8, markC)}</svg>`;
}

/* ---------- which question comes next: the engine picks a set of skills; each skill becomes a story ---------- */
let set = null, si = 0, Q = null, QS = null, pen = PENS[0][0], prevKey = "";
function nextQ() {
  for (let guard = 0; guard < 40; guard++) {
    if (!set || si >= set.items.length) {
      set = KidsEngine.nextSet(P.engine, M, Date.now(), Math.random); si = 0;
      if (!set.items.length) return null;                 // paused, or nothing to play
    }
    const item = set.items[si];
    if (item && typeof item === "object") {                // a parent's own question: "question = answer"
      const ans = Number(String(item.a).trim());
      if (Number.isFinite(ans) && ans >= 0 && ans < 1000 && Number.isInteger(ans)) return { parent: item, kind: "typed", story: item.q, ask: "", say: item.q, ans, correct: `Correct! The answer is ${ans}.`, fact: `The answer is ${ans}.`, hint: "Take your time. You can draw to help." };
      si++; continue;                                    // an answer the keypad cannot type is skipped
    }
    const q = KS.make(item, theme, Math.random, prevKey);
    if (q) { prevKey = q.key; return q; }
    si++;                                                // no story for this skill yet
  }
  return null;
}

/* ---------- screen ---------- */
function drawDots() { const k = P ? P.game.sinceReward : 0; $("#dots").innerHTML = Array.from({ length: REWARD_EVERY }, (_, i) => `<i class="${i < k ? "done" : i === k ? "now" : ""}"></i>`).join(""); }
function drawCoins(pop) { const c = $("#coins"); c.innerHTML = `${ICON.coin}<b>${P ? P.coins : 0}</b>`; if (pop) { c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); } }
function nextQuestion() {
  closeHint(); closeBoard(); clearDraw(); stopVoice();
  Q = nextQ();
  if (!Q) return showEnd("All done for now!", "There are no more questions today. See you tomorrow!");
  let L = Q.line || { lo: 0, hi: 10, step: 1 };
  if (L.step > 1 && Number.isFinite(Q.a)) {      // tens or hundreds: put the marks on the start number (94: 4, 14 ... 104)
    let lo = Q.a - (Q.op === "-" ? 10 * L.step : 0); while (lo < 0) lo += L.step;
    L = { lo, hi: lo + 10 * L.step, step: L.step };
  }
  QS = { tries: 0, phase: "ask", typed: "", pick: null, lo: L.lo, hi: L.hi, step: L.step || 1, line: null, hops: [], t0: Date.now(), hinted: false };
  $("#app").classList.toggle("nokeys", Q.kind === "choice"); $("#app").classList.remove("locked");
  hideMsg(); tileTo("", "Check"); $("#tile").hidden = false;
  drawDots(); drawCoins(); renderBody(); mascot("stand");
  setTimeout(() => say(Q.say), 250);
}
function boxCls() { return QS.mark === "right" ? "right" : QS.mark === "wrong" ? "wrong" : QS.phase === "ask" ? "active" : ""; }
const startOf = () => Number.isFinite(Q.a) ? Q.a : QS.lo;
const endOf = () => Number.isFinite(Q.result) ? Q.result : Q.ans;     // a missing part ends on the total, not on the answer
function renderBody() {
  const b = $("#qbody"), bulb = `<button class="bulb" aria-label="Hint">${ICON.bulb}</button>`;
  const story = `<div class="story">${Q.story}${Q.ask ? `<br><b>${Q.ask}</b>` : ""}<span class="inbulb">${bulb}</span></div>`;
  const top = Q.kind === "choice"
    ? `${story}<div class="bars">${Q.opts.map((o, i) => `<button class="opt" data-v="${o}"><small>${"abc"[i]})</small>${o}</button>`).join("")}</div>`
    : `${story}<div class="eq"><span class="box ${boxCls()}" id="ansBox">${QS.typed || "&nbsp;"}</span></div>`;
  const off = QS.phase === "shown" || QS.phase === "right" ? " disabled" : "";
  const tileEl = $("#tile"); tileEl.remove();             // Check sits in the row beside Restart; keep it while the body is rebuilt
  b.innerHTML = `<div class="qtop">${top}</div><div class="room"></div>
    <div class="qbottom"><div class="nlbox" aria-label="Number line"></div>
    <div class="hoprow"><button data-h="-1"${off} aria-label="Hop back"><i class="ar">◀ </i>Back</button><button data-h="1" class="fwd"${off} aria-label="Hop forward">Forward<i class="ar"> ▶</i></button><button data-h="0"${off} aria-label="Start again"><i class="ar">↺ </i>Restart</button></div></div>`;
  b.querySelector(".hoprow").appendChild(tileEl);
  drawLine();
  b.querySelectorAll(".bulb").forEach(x => x.onclick = e => { e.stopPropagation(); document.querySelector(".bubble") ? closeHint() : openHint(); });
  b.querySelectorAll(".opt").forEach(x => x.onclick = () => { if (QS.phase !== "ask" || QS.teaching) return; QS.pick = +x.dataset.v; QS.mark = null; renderBody(); });
  if (QS.pick != null) b.querySelectorAll(`.opt[data-v="${QS.pick}"]`).forEach(x => x.classList.add("sel", ...(QS.mark ? [QS.mark] : [])));
  b.querySelectorAll(".hoprow button[data-h]").forEach(x => x.onclick = () => { const h = +x.dataset.h; if (h) hopTo(QS.line + h * QS.step); else restart(); });
  if (QS.board) placeBoard();
}
function restart() { if (!QS || QS.phase === "shown") return; QS.line = startOf(); QS.hops = []; renderBody(); }

/* ---------- number line: 11 marks, in ones, tens or hundreds; the newest hop shows how many so far ---------- */
const onGrid = v => v >= QS.lo && v <= QS.hi && (v - QS.lo) % QS.step === 0;
function fitLine(from, to, step) {              // move the window so a lesson hop fits, keeping the marks on the hop's grid
  if (QS.step === step && onGrid(from) && onGrid(to)) return;

/* ---------- one answer is finished: tell the engine, pay coins, move the counters ---------- */
function finished(correct) {
  if (QS.counted) return; QS.counted = true;
  addTime();
  const st = P.engine, d = dayLog();
  const taught = QS.tries > 0, helped = taught || QS.hinted;

  const down = matchMedia(NARROW).matches;
  $("#tools").innerHTML = PENS.map(([c, d]) => `<button class="pencil" data-c="${c}" aria-label="Colour pencil">${pencilSVG(c, d, down)}</button>`).join("")
    + `<button class="rubber" data-t="erase" aria-label="Rubber">${rubberSVG(down)}</button><div class="grow"></div><button class="bin" data-t="clear" aria-label="Clear the drawing">${ICON.bin}</button><button class="bin home" data-t="home" aria-label="Back to the start">${ICON.home}</button>`;
  $("#tools").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.t === "clear") return clearDraw();
    if (b.dataset.t === "home") return doors();
    pen = b.dataset.c || "erase"; markTools();
  });
  markTools();
}
function markTools() { $("#tools").querySelectorAll("button").forEach(b => b.classList.toggle("on", (b.dataset.c || b.dataset.t) === pen)); }
let gd = null;
function sizeDraw() {
  const c = $("#draw"), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
  gd = c.getContext("2d"); gd.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function clearDraw() { const c = $("#draw"); if (gd) { gd.save(); gd.setTransform(1, 0, 0, 1, 0, 0); gd.clearRect(0, 0, c.width, c.height); gd.restore(); } }
function setupDraw() {
  const c = $("#draw"); let last = null;
  const at = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const style = () => { const er = pen === "erase"; gd.globalCompositeOperation = er ? "destination-out" : "source-over";
    gd.strokeStyle = er ? "#000" : pen; gd.fillStyle = gd.strokeStyle; gd.lineWidth = er ? 30 : 5; gd.lineCap = gd.lineJoin = "round"; };
  c.onpointerdown = e => { if (!gd) return; e.preventDefault(); c.setPointerCapture(e.pointerId); last = at(e); style(); gd.beginPath(); gd.arc(last[0], last[1], gd.lineWidth / 2, 0, 7); gd.fill(); };
  c.onpointermove = e => { if (!last) return; e.preventDefault(); const p = at(e); style(); gd.beginPath(); gd.moveTo(last[0], last[1]); gd.lineTo(p[0], p[1]); gd.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => last = null;
}

/* ---------- cards ---------- */
function overlay(html, cls = "") {
  return new Promise(res => {
    const o = document.createElement("div"); o.className = ("over " + cls).trim(); o.innerHTML = html; document.body.appendChild(o);
    o.querySelectorAll("button").forEach(b => b.onclick = () => { o.remove(); res(b.dataset.v); });
  });
}
async function showEnd(title, text) {
  QS = null; stopVoice(); closeBoard(); save();
  say(`${title} ${text}`);
  await overlay(`<div class="panel"><div class="mascot-big">${art("happy")}</div><h1>${title}</h1><p>${text}</p><button class="go">OK</button></div>`);
  doors();
}
/* the doors: each child taps their own picture; no other choice */
async function doors() {
  stopVoice(); closeBoard(); closeHint(); save(); QS = null; who = null; P = null;
  document.querySelectorAll(".over, .rewardhost").forEach(o => o.remove());
  const door = w => `<button class="go" data-theme="${PROFILES[w].theme}" data-v="${w}"><span class="art">${art("wave", PROFILES[w].theme)}</span>${PROFILES[w].name}<small>${PROFILES[w].world}</small></button>`;
  const w = await overlay(`<div class="panel"><h1>Kids Maths</h1><p>Tap your picture.</p><div class="pick">${door("marie")}${door("kennedy")}</div></div>`, "start");
  start(w);
}
function start(w) {
  who = PROFILES[w] ? w : "marie"; P = loadSave(who); set = null; si = 0; prevKey = ""; lastAct = Date.now();
  setTheme(PROFILES[who].theme); audioCtx(); sizeDraw(); save();
  M.order.forEach(id => { M.map[id].ready = KS.SKILLS.includes(id) && KS.fits(id, theme); });   // cafe kinds are Marie's, knight kinds Kennedy's
  if (P.engine.paused) return showEnd("Maths is resting.", "A grown-up paused maths for now.");
  if (overLimit()) return showEnd("See you tomorrow!", "That is all the maths for today. Well done!");
  nextQuestion();
}

/* ---------- start ---------- */
$("#speak").innerHTML = ICON.speaker; $("#speak").onclick = () => QS && say(Q.say);
$("#tile").onclick = tile;
buildTools(); buildPad(); setupDraw();
let wasNarrow = matchMedia(NARROW).matches;
addEventListener("resize", () => {
  const nw = matchMedia(NARROW).matches; if (nw !== wasNarrow) { wasNarrow = nw; buildTools(); }
  buildPad(); sizeDraw(); if (QS) renderBody();
});
addEventListener("pagehide", save);
requestAnimationFrame(sizeDraw);
drawDots(); mascot("stand");
if (TRY && PROFILES[TRY]) { start(TRY); P.coins = Math.max(P.coins, 300); save(); drawCoins(false); playWorld(); } else doors();
window.__game = { get Q() { return Q; }, get QS() { return QS; }, get P() { return P; }, get set() { return set; }, M, start, doors,
  lesson() { if (!Q) return; closeBoard(); QS.tries = 1; return teach(); } };
</script>
