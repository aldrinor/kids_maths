<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kids Maths"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Kids Maths</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Look: one illustrated scene, like a children's app, not a web page.
   Pink striped wallpaper; chunky toy buttons with a dark outline and a shadow under them;
   the sum on a signboard; blocks on a gingham tablecloth; the number line is a wooden ruler Kitty hops along;
   number keys are candy drops. Phone = one column; wide screens = scene left, signboard and candy keys right.
   One light look on purpose (a child's toy), so every colour is set explicitly for any host theme. */
:root {
  color-scheme: light;
  --ink: #3b2a33;
  --soft-ink: #6e5562;
  --wall-a: #ffe4ee;
  --wall-b: #fff6f9;
  --cream: #fff8ef;
  --paper: #ffffff;
  --pink: #ff6f9f;
  --pink-deep: #e0306b;
  --mint: #63d3b3;
  --mint-deep: #23a483;
  --lilac: #a98bff;
  --lilac-deep: #7b55e6;
  --sun: #ffc94a;
  --sky: #74c8ff;
  --wood: #f0bf87;
  --wood-deep: #c98a52;
  --good: #23a483;
  --good-tint: #e2f8f0;
  --warn: #c2511a;
  --jump: #7b55e6;
  --line-c: #3b2a33;
  --pink-tint: #ffe4ee;
  --gold: #ffb020;
  --blk: clamp(44px, 11.5vw, 58px);
  --display: "Baloo 2", "Comic Sans MS", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; color: var(--ink); background: var(--wall-b); }
body { margin: 0; overflow: hidden; font-family: var(--body); font-size: 17px;
  background: repeating-linear-gradient(90deg, var(--wall-a) 0 26px, var(--wall-b) 26px 52px);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; }
button { font-family: var(--display); color: var(--ink); touch-action: manipulation; -webkit-user-select: none; user-select: none; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 4px solid var(--sky); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
img, svg { -webkit-user-drag: none; user-select: none; }
img { pointer-events: none; }
.app { height: 100%; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-block: 8px; box-sizing: border-box; }

/* Chunky toy surfaces and buttons */
.toy { border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); }
.chunky { border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); font-weight: 800; transition: transform .08s, box-shadow .08s; }
.chunky:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

/* Header */
.top { flex: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.top h1 { margin: 0; font: 800 clamp(22px, 3vw, 30px)/1 var(--display); color: var(--pink-deep); white-space: nowrap; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; }
.dots { display: flex; gap: 4px; justify-content: center; align-items: center; }
.dots img { width: 28px; height: 28px; opacity: .25; filter: grayscale(1); transition: opacity .3s, transform .3s; }
.dots img.on { opacity: 1; filter: none; transform: scale(1.12) rotate(-6deg); }
.score { display: inline-flex; align-items: center; gap: 4px; background: var(--sun); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); border-radius: 999px; padding: 0 12px 0 4px; font: 800 19px var(--display); font-variant-numeric: tabular-nums; }
.score img { width: 26px; height: 26px; }
.score.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.2) rotate(-4deg); } }
.tabs { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tab { min-height: 46px; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); background: var(--cream); font: 800 17px var(--display); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; white-space: nowrap; }
.tab img { width: 28px; height: 28px; }
#tabSums[aria-selected="true"] { background: var(--pink); color: #fff; }
#tabHome[aria-selected="true"] { background: var(--mint); color: #fff; }
#tabMaths[aria-selected="true"] { background: var(--sky); color: #fff; }
#tabGrown[aria-selected="true"] { background: var(--lilac); color: #fff; }
.tab[aria-selected="true"] { text-shadow: 0 2px 0 rgba(59, 42, 51, .35); }
@media (max-width: 560px) { .top h1 { display: none; } .top { grid-template-columns: minmax(0, 1fr) auto; } .dots img { width: 24px; height: 24px; } .tab { font-size: 14px; line-height: 1; gap: 1px; flex-direction: column; padding: 2px; } .tab img { width: 24px; height: 24px; } }
@media (max-width: 360px) { .tabs { gap: 6px; } .tabs .tab { font-size: 11.5px; letter-spacing: -.3px; padding: 0; } }
.view { flex: 1; min-height: 0; position: relative; }
.scroll { overflow: auto; }

/* Sums screen */
.sums { height: 100%; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "say" "eq" "blocks" "line" "pad"; }
.side { display: contents; }
.say { grid-area: say; } .eq { grid-area: eq; } .blocks { grid-area: blocks; } .line { grid-area: line; } .pad { grid-area: pad; }
@media (min-width: 900px) and (min-height: 560px) {
  :root { --blk: 58px; }
  .sums { grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "say say" "blocks side" "line side"; gap: 12px; }
  .side { display: flex; grid-area: side; flex-direction: column; justify-content: center; gap: 18px; }
  .side .eq { font-size: 60px; padding: 18px 12px; }
  .side .key { min-height: 70px; font-size: 32px; }
}

/* Kitty the teacher */
.say { display: grid; grid-template-columns: 56px minmax(0, 1fr) 48px 48px; gap: 8px; align-items: center; }
.say .kitty { width: 56px; height: 56px; filter: drop-shadow(0 3px 0 rgba(59, 42, 51, .25)); }
.say .kitty.happy { animation: hop .45s ease 2; }
.say .kitty.think { animation: tilt .7s ease; }
@keyframes hop { 50% { transform: translateY(-10px) rotate(-4deg); } }
@keyframes tilt { 30% { transform: rotate(-8deg); } 70% { transform: rotate(6deg); } }
.bubble { position: relative; margin: 0; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; padding: 6px 14px; font: 700 clamp(15px, 2.1vw, 20px)/1.2 var(--display); min-height: 2.4em; display: flex; align-items: center; box-sizing: border-box; box-shadow: 0 4px 0 var(--ink); }
.bubble::before { content: ""; position: absolute; left: -12px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right: 12px solid var(--ink); border-left: 0; }
.bubble::after { content: ""; position: absolute; left: -7px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-right: 8px solid var(--paper); border-left: 0; }
.bubble.good { background: var(--good-tint); color: #0f6e4a; } .bubble.good::after { border-right-color: var(--good-tint); }
.bubble.warn { background: #fff1e6; color: var(--warn); } .bubble.warn::after { border-right-color: #fff1e6; }
.bubble.teach { background: #fff6d6; } .bubble.teach::after { border-right-color: #fff6d6; }
.speak { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); background: var(--sun); display: grid; place-items: center; padding: 0; }
.speak svg { width: 24px; height: 24px; }

/* The sum on a signboard */
.eq { position: relative; display: flex; justify-content: center; align-items: center; gap: .24em; font: 800 clamp(32px, 8.5vw, 54px)/1 var(--display); font-variant-numeric: tabular-nums;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); padding: 3px 10px; }
.eq > span { -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.eq .op { color: var(--ink); -webkit-text-stroke: 0; }
.ans { min-width: 1.6em; padding: 0 .14em; text-align: center; border-radius: 16px; border: 3px dashed var(--pink-deep); background: #fff; color: var(--ink); -webkit-text-stroke: 0 !important; }
.ans.filled { border-style: solid; background: #fff0f5; }
.ans.dim { opacity: .35; border-color: var(--soft-ink); }
.eq.long { font-size: clamp(26px, 7vw, 44px); }
@media (min-width: 900px) and (min-height: 560px) { .side .eq.long { font-size: 42px; } }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* Blocks on a gingham tablecloth */
.blocks { position: relative; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink);
  background:
    repeating-linear-gradient(0deg, rgba(255, 111, 159, .16) 0 16px, transparent 16px 32px),
    repeating-linear-gradient(90deg, rgba(255, 111, 159, .16) 0 16px, transparent 16px 32px), var(--paper); }
.recount { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); background: var(--paper); display: grid; place-items: center; padding: 0; font: 800 22px var(--display); }
.blocks-body { position: relative; flex: 1; min-height: 0; overflow: auto; padding: 10px; }
.stack { display: grid; justify-content: center; row-gap: 8px; }
/* Each person's blocks sit in their own box, so the question number sticks only over its own blocks. */
.who { display: grid; grid-template-columns: auto auto; column-gap: 10px; align-items: start; }
/* The question number stays in sight while the blocks panel scrolls. Both numbers get the same width, so both block groups start at the same left edge. */
.stack .num { text-align: right; font: 800 34px/var(--blk) var(--display); height: var(--blk); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; width: calc(var(--nd, 2) * .62em); position: sticky; top: 0; z-index: 2; }
.stack .num .pl { color: var(--ink); -webkit-text-stroke: 0; margin-right: .08em; }
.row-blocks { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 14px; }
.grp5 { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; }
/* Ones: each ten is two rows of 5. Where there is room the two fives sit side by side with a wider gap. */
.frames { display: grid; gap: 8px; }
.ten { display: flex; flex-wrap: wrap; gap: 5px 12px; }
.five { display: flex; gap: 5px; }
.blk { position: relative; width: var(--blk); height: var(--blk); border: 0; padding: 0; background: transparent; border-radius: 12px; }
.blk svg { width: 100%; height: 100%; display: block; overflow: visible; }
.blk.tower { height: calc(var(--blk) * 2.3); width: max(44px, calc(var(--blk) * .8)); }
.blk.plate { width: calc(var(--blk) * 1.55); height: calc(var(--blk) * 1.55); }
/* A counted block gets a heart stamp: a mark with no number, so she counts herself. */
.blk .mark { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; z-index: 1; pointer-events: none; filter: drop-shadow(0 2px 0 rgba(59, 42, 51, .3)); }
.blk .mark svg { width: 100%; height: 100%; display: block; }
.blk.wiggle { animation: wiggle .45s ease; }
@keyframes wiggle { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
/* Kitty's pointing glow in the lesson: a still outline (works with reduced motion) plus a soft pulse. */
.blk.glow { outline: 5px solid var(--pink-deep); outline-offset: 3px; border-radius: 14px; animation: glowpulse 1.1s ease-in-out infinite; }
.jbtn.glow { outline: 5px solid var(--sun); outline-offset: 2px; animation: glowpulse2 1.1s ease-in-out infinite; }
@keyframes glowpulse { 50% { outline-color: var(--sun); } }
@keyframes glowpulse2 { 50% { outline-color: var(--pink-deep); } }
.blk.gone { opacity: .28; filter: grayscale(.6); }
.blk.gone::after { content: ""; position: absolute; inset: 8%; background:
  linear-gradient(45deg, transparent 43%, var(--warn) 43%, var(--warn) 57%, transparent 57%),
  linear-gradient(-45deg, transparent 43%, var(--warn) 43%, var(--warn) 57%, transparent 57%); }
.blk.pop { animation: pop .3s ease-out; }
@keyframes pop { from { transform: scale(.4); } 70% { transform: scale(1.12); } }

/* The ruler number line */
.line { display: grid; gap: 4px; padding: 6px 10px 8px; background: var(--cream); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink); }
.line.focus { background: #fff6d6; }
.run { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.run .sentence { font: 800 clamp(20px, 3vw, 28px)/1.1 var(--display); font-variant-numeric: tabular-nums; }
.run .sentence b { color: var(--lilac-deep); }
.run .sentence .stops { font-size: .72em; color: var(--lilac-deep); white-space: nowrap; }
.run .taps { flex: none; font: 800 16px var(--display); color: #fff; background: var(--lilac); border: 3px solid var(--ink); border-radius: 999px; padding: 1px 12px; font-variant-numeric: tabular-nums; }
/* The number line is drawn at the real width of the panel, so its numbers keep their real size on phones. */
.line svg { width: 100%; height: auto; display: block; }
/* The stop box: on big sums Kitty stops where the hop size changes and she types that number here. */
.stopbox { display: inline-block; min-width: 2.4em; padding: 0 .3em; margin-left: .2em; text-align: center; border: 3px solid var(--pink-deep); border-radius: 14px; background: #fff; color: var(--ink); }
.stopbox.glow { outline: 5px solid var(--sun); outline-offset: 2px; animation: glowpulse2 1.1s ease-in-out infinite; }
.line .arcnew { animation: draw .35s ease-out; }
@keyframes draw { from { stroke-dashoffset: 1; } }
.jbtns { display: grid; grid-template-columns: minmax(0, 1fr) 48px 48px; gap: 8px; align-items: center; }
/* While a stop number waits, the hop buttons make way for the stop box (hops are blocked until she types it). */
.stopwrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 6px; min-height: 48px; font: 800 20px/1.1 var(--display); text-align: center; }
.stopwrap .stopbox { margin-left: 0; }
.jbtns.many { grid-template-columns: repeat(var(--n), minmax(0, 1fr)) 48px 48px; }
.jbtn { min-height: 48px; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); font: 800 21px var(--display); background: var(--lilac); color: #fff; text-shadow: 0 2px 0 rgba(59, 42, 51, .35); }
.jbtn.icon { width: 48px; padding: 0; background: var(--paper); color: var(--ink); text-shadow: none; font-size: 24px; border-radius: 50%; }
.jbtn:active:not(:disabled), .key:active, .tab:active, .speak:active, .recount:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

/* Candy keys */
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.35fr); gap: 6px; padding-bottom: env(safe-area-inset-bottom, 0px); }
.key { min-height: 46px; border: 3px solid var(--ink); border-radius: 20px 20px 16px 16px; box-shadow: 0 4px 0 var(--ink), inset 0 -6px 0 rgba(0, 0, 0, .12), inset 0 5px 0 rgba(255, 255, 255, .45);
  background: var(--c, var(--pink)); color: #fff; font: 800 28px var(--display); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.key.del { --c: var(--paper); color: var(--ink); -webkit-text-stroke: 0; font-size: 24px; }
.key.check { --c: var(--mint); font-size: 30px; -webkit-text-stroke: 0; text-shadow: 0 2px 0 rgba(59, 42, 51, .35); font-size: 24px; }

/* Start cover */
.cover[hidden] { display: none !important; }
.cover { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; text-align: center; padding: 10px;
  background: repeating-linear-gradient(90deg, var(--wall-a) 0 26px, var(--wall-b) 26px 52px); }
.cover-card { background: var(--cream); border: 3px solid var(--ink); border-radius: 28px; box-shadow: 0 6px 0 var(--ink); padding: 18px 14px 22px; max-width: min(520px, 100%); box-sizing: border-box; }
.cover h2 { margin: 6px 0; font: 800 clamp(30px, 6vw, 44px)/1.05 var(--display); color: var(--pink); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.cover p { margin: 0 auto 16px; font-weight: 800; color: var(--soft-ink); max-width: 38ch; }
.main-btn { min-height: 60px; padding: 0 34px; border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink); background: var(--pink); color: #fff; font: 800 24px var(--display); text-shadow: 0 2px 0 rgba(59, 42, 51, .35); }
.main-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.hello { display: flex; gap: 4px; justify-content: center; }
.hello svg { width: clamp(40px, 13vw, 88px); height: auto; animation: hop 1.6s ease-in-out infinite; filter: drop-shadow(0 3px 0 rgba(59, 42, 51, .2)); }
.hello svg:nth-child(2) { animation-delay: .2s; } .hello svg:nth-child(3) { animation-delay: .4s; } .hello svg:nth-child(4) { animation-delay: .6s; } .hello svg:nth-child(5) { animation-delay: .8s; }
.mini { min-height: 46px; padding: 0 14px; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 3px 0 var(--ink); background: var(--paper); color: var(--ink); font: 800 16px var(--display); }

/* Cooking break: the cook.js module draws everything inside #cook */
.cook-layer { position: absolute; inset: 0; z-index: 6; }
.cook { position: absolute; inset: 0; z-index: 6; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding: 12px; box-sizing: border-box; border: 3px solid var(--ink); border-radius: 24px; box-shadow: 0 5px 0 var(--ink);
  background: repeating-linear-gradient(45deg, #fff7e8 0 18px, #ffefd2 18px 36px); }
.cook-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 800 clamp(24px, 4vw, 32px) var(--display); color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.stage { position: relative; display: grid; place-items: center; min-height: 0; }
.bowl { width: min(46vw, 230px, 34vh); height: auto; filter: drop-shadow(0 6px 0 rgba(59, 42, 51, .18)); }
.bowl.stir { animation: stir .5s ease; }
@keyframes stir { 50% { transform: rotate(-14deg) scale(1.05); } }
.oven { width: min(62vw, 300px, 42vh); aspect-ratio: 5 / 4; border-radius: 28px; background: var(--pink); border: 4px solid var(--ink); display: grid; place-items: center; position: relative; box-shadow: 0 6px 0 var(--ink); box-sizing: border-box; }
.oven::before { content: ""; position: absolute; left: 14%; right: 14%; top: 8%; height: 9%; border-radius: 99px; background: #fff; border: 3px solid var(--ink); box-sizing: border-box; }
.oven .win { width: 64%; aspect-ratio: 16 / 10; border-radius: 18px; background: var(--ink); border: 4px solid #fff; display: grid; place-items: center; overflow: hidden; margin-top: 10%; box-sizing: border-box; }
.oven .win.hot { animation: glow 1s ease-in-out infinite; }
@keyframes glow { 50% { background: #ff8a3d; } }
.oven .win img { width: 46%; }
.result { position: relative; width: min(50vw, 240px, 34vh); margin: auto; }
.result > img { width: 100%; display: block; filter: drop-shadow(0 6px 0 rgba(59, 42, 51, .18)); }
.result .top-on { position: absolute; width: 26%; animation: drop .35s ease-out; }
@keyframes drop { from { transform: translateY(-60px) scale(1.4); opacity: 0; } }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr)); gap: 10px; }
.choice { min-height: 78px; border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 4px 0 var(--ink); background: var(--paper); display: grid; place-items: center; padding: 4px; }
.choice img { width: 56px; height: 56px; }
.choice.next { background: #fff6d6; animation: pulse 1s ease-in-out infinite; }
.choice.used { opacity: .3; }
.bowl-btn { border: 0; background: transparent; padding: 0; animation: pulse 1.2s ease-in-out infinite; border-radius: 50%; }
.cook-note { text-align: center; font: 800 22px var(--display); color: var(--ink); align-self: center; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* Home */
.home { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; }
.home > * { min-width: 0; }
.room { position: relative; min-height: 200px; border-radius: 24px; overflow: hidden; touch-action: none; border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink);
  background: repeating-linear-gradient(90deg, #fff0d9 0 30px, #ffe6c4 30px 60px); }
.room::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background: repeating-linear-gradient(90deg, var(--wood) 0 60px, #e6ad6f 60px 120px); border-top: 3px solid var(--ink); }
.room .win { position: absolute; left: 6%; top: 8%; width: 17%; aspect-ratio: 1; border-radius: 14px; border: 3px solid var(--ink); background: linear-gradient(#a9dcff, #e2f4ff); box-sizing: border-box; box-shadow: inset 0 0 0 5px #fff; }
.room .win::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent calc(50% - 2px), #fff calc(50% - 2px), #fff calc(50% + 2px), transparent calc(50% + 2px)), linear-gradient(transparent calc(50% - 2px), #fff calc(50% - 2px), #fff calc(50% + 2px), transparent calc(50% + 2px)); }

      s += `<rect x="${(x(k) - sp / 2).toFixed(1)}" y="0" width="${sp.toFixed(1)}" height="${RY + RH}" fill="transparent" data-n="${k}"/>`;
    }
    // Labels never run together: Kitty's shown number first, then the start, then the landmarks 0, 5, 10, 15, 20.
    const lw = v => String(v).length * FL * .55 + 2, keepS = [];
    const roomS = (cx, w) => keepS.every(k => Math.abs(k.x - cx) >= (k.w + w) / 2 + 3);
    // Every tick has its number, and the number Kitty stands on sits in a purple pill (Aldrin asked, 19 Oct 2026).
    keepS.push({ x: x(kpos), w: lw(kpos) + 8 }); s += curPill(x(kpos), kpos);
    for (let k = lo; k <= hi; k++) {
      if (k === kpos) continue;
      const fs = Math.max(9, Math.min(FL, Math.floor(sp * .92 / (String(k).length * .6))));
      if (roomS(x(k), String(k).length * fs * .55 + 2)) s += txt(x(k), LY, k, fs, k === line.start ? "#e0306b" : "#3b2a33");
    }
    kx = x(kpos);
  } else {
    // Open line: every planned hop has its own place; a run of same-size hops is never shorter than a label.
    const plan = jumpPlan(Q), wt = sz => sz >= 100 ? 2.2 : sz >= 10 ? 1.6 : 1;
    const runs = []; plan.forEach(p => { const sz = Math.abs(p); if (runs.length && runs[runs.length - 1].sz === sz) runs[runs.length - 1].n++; else runs.push({ sz, n: 1 }); });
    const M = narrow ? 22 : 34, avail = W - 2 * M, MIN = narrow ? 42 : 60, CAP = narrow ? 44 : 80;
    let u = avail / Math.max(1, plan.reduce((t, p) => t + wt(Math.abs(p)), 0));
    for (let it = 0; it < 6; it++) {
      let fixed = 0, flex = 0;
      runs.forEach(r => { const len = r.n * wt(r.sz) * u; if (len < MIN) fixed += MIN; else flex += r.n * wt(r.sz); });
      u = Math.min(CAP, flex ? (avail - fixed) / flex : u);
    }
    const step = []; runs.forEach(r => { const len = Math.max(MIN, r.n * wt(r.sz) * u); for (let i = 0; i < r.n; i++) step.push(len / r.n); });
    const total = step.reduce((t, v) => t + v, 0), x0 = sign > 0 ? (W - total) / 2 : (W + total) / 2;
    const X = i => x0 + sign * step.slice(0, i).reduce((t, v) => t + v, 0);
    // Hop sizes ("+10", "−100") sit over their arcs. Kitty's face sits at the end of the last hop, so that label
    // moves away from her face (as far as the label before it allows) and is drawn on top of her with a white edge.
    let lastLab = "", edge = null;   // edge: the near side of the label before, so labels never touch
    const kx0 = X(taps);
    line.hops.forEach((h, i) => {
      const x1 = X(i), x2 = X(i + 1), lift = Math.min(KS * .8, 8 + Math.abs(x2 - x1) * .5), sz = Math.abs(h);
      s += arc(x1, x2, lift, sz >= 100 ? "#e0306b" : sz === 10 ? "#7b55e6" : "#23a483", sz >= 10 ? (narrow ? 3.5 : 4.5) : 3, hopAnim && i === taps - 1);
      const t = `${h > 0 ? "+" : MINUS}${sz}`, w = textW(t, FH);
      if (!(sz >= 10 && Math.abs(x2 - x1) >= w + 2)) return;
      let cx = (x1 + x2) / 2;
      const y = RY - 2 - lift / 2 - 3;
      if (i === taps - 1) {
        if (sign > 0) { cx = Math.min(cx, kx0 - KS / 2 - 2 - w / 2); if (edge !== null) cx = Math.max(cx, edge + 3 + w / 2); cx = Math.max(cx, w / 2 + 2); }
        else { cx = Math.max(cx, kx0 + KS / 2 + 2 + w / 2); if (edge !== null) cx = Math.min(cx, edge - 3 - w / 2); cx = Math.min(cx, W - w / 2 - 2); }
        lastLab = `<text x="${cx.toFixed(1)}" y="${y}" text-anchor="middle" font-size="${FH}" font-weight="800" fill="#3b2a33" stroke="#fffaf3" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-family="Baloo 2, sans-serif">${t}</text>`;
      } else s += txt(cx, y, t, FH, "#3b2a33");
      edge = sign > 0 ? cx + w / 2 : cx - w / 2;
    });
    // Small unlabelled ticks where she landed, so she can count the hops.
    for (let i = 1; i <= taps; i++) s += `<line x1="${X(i).toFixed(1)}" y1="${RY}" x2="${X(i).toFixed(1)}" y2="${RY + 9}" stroke="#3b2a33" stroke-width="2"/>`;
    // Labels: Kitty's number (while Kitty counts with her) or the "?" flag first, then the start, then the stops she typed.
    const keep = [];
    const room = (cx, w) => keep.every(k => Math.abs(k.x - cx) >= (k.w + w) / 2 + 6);
    const askHere = phase !== "done" && cur === null && taps > 0 && (waiting || planDone()) && !line.known.some(k => k.n === taps);
    if (cur !== null) keep.push({ x: X(taps), w: textW(line.pos, FL) + 8, svg: curPill(X(taps)) });
    else if (askHere) keep.push({ x: X(taps), w: FL * 1.8, svg: flag(X(taps)) });
    if (prev !== null && room(X(taps - 1), textW(prev, FL) + 8)) keep.push({ x: X(taps - 1), w: textW(prev, FL) + 8, svg: curPill(X(taps - 1), prev) });
    const marks = [{ i: 0, v: line.start, col: "#e0306b" }, ...line.known.map(k => ({ i: k.n, v: k.v, col: "#3b2a33" }))];
    for (const m of marks) {
      const cx = X(m.i), w = textW(m.v, FL);
      if (room(cx, w)) keep.push({ x: cx, w, svg: txt(cx, LY, m.v, FL, m.col) });
    }
    keep.forEach(k => { s += `<line x1="${k.x.toFixed(1)}" y1="${RY}" x2="${k.x.toFixed(1)}" y2="${RY + 12}" stroke="#3b2a33" stroke-width="3"/>` + k.svg; });
    kx = X(taps);
    s += kittyAt(kx) + lastLab;
  }
  if (isSmall(Q)) s += kittyAt(kx) + hopLabs;
  const where = waiting ? "Mimi stopped. Type the number where she is." : planDone() && taps ? "Mimi finished her hops." : taps ? "Mimi is hopping." : "";
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Number line. Mimi started on ${line.start}. ${where}">${s}</svg>`;
  const sizes = jumpSizes(Q), glowHop = teachTargets().hop;
  // While a stop number waits, the stop box takes the place of the hop buttons (hops are blocked until she types it).
  const btns = waiting
    ? `<span class="stopwrap">Stopped on <span class="stopbox glow" id="stopBox" role="textbox" aria-label="Type where Mimi stopped">${stopTyped || "?"}</span></span>`
    : sizes.map(sz => `<button class="jbtn${glowHop === sz ? " glow" : ""}" type="button" data-j="${sign * sz}">${isSmall(Q) ? (sign > 0 ? "Hop +1" : `Hop ${MINUS}1`) : (sign > 0 ? "+" : MINUS) + sz}</button>`).join("");
  const many = !waiting && sizes.length > 1;
  box.innerHTML = `<div class="run"><span class="sentence" id="runSentence" aria-live="polite">${sentence}</span>${pill}</div>${svg}
    <div class="jbtns${many ? " many" : ""}" style="--n:${sizes.length}">${btns}<button class="jbtn icon" type="button" data-undo="1" aria-label="Undo" title="Undo"${taps ? "" : " disabled"}>↶</button><button class="jbtn icon" type="button" data-restart="1" aria-label="Start again" title="Start again">⟲</button></div>`;
  // Kitty hops along an arc from where she was: only right after her own tap.
  const g = $("lineKitty");
  if (g && hopAnim && kittyX !== null && !reduceMotion() && g.animate) {
    const dx = kittyX - kx;
    g.animate([{ transform: `translate(${dx}px, 0px)` }, { transform: `translate(${dx / 2}px, -${Math.round(KS * .6)}px)` }, { transform: "translate(0px, 0px)" }], { duration: 380, easing: "ease-out" });
  }

// Redraw the number line when its width changes (turning the device, resizing, or coming back to the Sums tab).
// A redraw never starts a hop animation.

}

function pickChildForParent() {

// A simple lock so the children cannot change their own level. Not a strong password.
const PIN_KEY = "kidsMaths.parentCode", PIN_SET = "1523212847";   // the parents chose this code (19 Oct 2026)
const pinHash = t => { let h = 5381; for (const c of "kids-maths:" + t) h = ((h * 33) ^ c.charCodeAt(0)) >>> 0; return String(h); };
function parentGate(done) {
  if (Date.now() < parentUntil) return done();
  let saved = PIN_SET; try { saved = localStorage.getItem(PIN_KEY) || PIN_SET; } catch (e) {}
  const box = $("profiles"); box.hidden = false;
  let first = "";
  const ask = (title, label) => {
    box.innerHTML = `<div class="prof-card"><h2 id="profTitle">${title}</h2><form class="pin" id="pinForm">
      <label for="pinIn">${label}</label><input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
      <p class="pin-msg" id="pinMsg" aria-live="assertive"></p>

    $("pinIn").focus();

    box.hidden = true; box.innerHTML = "";

}
