<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Maths Practice Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
<!-- Practice demo for Kids Maths (20 Oct 2026). Question screen follows Prodigy Math's layout
     (prodigy_design_blueprint.md 2.12 to 2.20), without the battle. Aldrin's changes:
     - questions one after another; after a right answer the next one comes by itself;
     - number line at the bottom, free drawing space in the middle; real-looking colour pencils and a rubber;
     - the newest hop shows how many so far (+1, then +2 ...);
     - a wrong answer wipes the drawing and hand-writes the working in the middle, step by step with the voice
       (make 10 first, back to 10 first, ones and keep the 10, or hops); "Watch again" replays it;
     - a natural recorded voice (voice/<hash>.mp3, made with the free Kokoro voice); tools make no sound.
     Questions, teaching steps and all sentences live in phrases.js. -->
<style>
:root {
  --teal: #0aae90; --teal-dark: #0b6f59; --teal-soft: #e9f8f4; --blue: #027cbc; --blue-edge: #076a9c; --orange: #fb8405;
  --amber: #eba647; --salmon: #dd9089; --key: #f9f9f9; --keypad: #c9cacd; --panel: #eeeeee;
  --ink: #3f3f3f; --navy: #2c3e50; --green: #2fae5b; --red: #d9534f; --bg: #fbfefd; --paper: #fffdf6;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; overflow-x: clip; background: var(--bg); color: var(--ink);
  font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(76px, 10vw, 112px);
  grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "top tools" "work tools" "msg msg" "keys keys"; }
#top { grid-area: top; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 12px 16px 0; }
#speak { width: clamp(46px, 6vw, 60px); height: clamp(46px, 6vw, 60px); border-radius: 50%; border: 0; background: var(--teal); display: grid; place-items: center; }
#speak svg { width: 52%; height: 52%; }
#dots { display: flex; justify-content: center; gap: clamp(4px, 1vw, 10px); padding-right: clamp(46px, 6vw, 60px); }
#dots i { width: clamp(10px, 1.6vw, 16px); height: clamp(10px, 1.6vw, 16px); border-radius: 50%; background: #dfe5e3; }
#dots i.done { background: var(--teal); } #dots i.now { box-shadow: 0 0 0 3px rgba(10, 174, 144, .35); background: #bfeee4; }

#work { grid-area: work; position: relative; min-height: 0; overflow: hidden; }
#draw { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; touch-action: none; cursor: crosshair; }
#qbody { position: absolute; inset: 6px 16px 10px; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
#qbody .box, #qbody .opt, #qbody .bulb, #qbody .nlbox, #qbody .hoprow { pointer-events: auto; position: relative; z-index: 4; }
#qbody .bulb { position: absolute; z-index: 5; }
.qtop { width: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 18px); padding-top: clamp(4px, 2vh, 20px); text-align: center; }
.room { flex: 1; width: 100%; min-height: 40px; }
.qbottom { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.qline { font-weight: 800; font-size: clamp(20px, 2.8vw, 28px); color: #5f5f5f; }
.qline .kw { color: var(--teal); }
.story { font-size: clamp(17px, 2.4vw, 24px); font-weight: 600; max-width: 34em; line-height: 1.45; text-align: left; }
.eq { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: clamp(10px, 2vw, 22px); font-size: clamp(32px, 5.4vw, 52px); color: #4a4a4a; font-weight: 800; }
.box { min-width: 2.4em; height: 1.5em; border: 3px solid #98adcf; border-radius: 10px; background: #fff; display: grid; place-items: center; padding: 0 .25em; color: #333; }
.box.active { border-color: #3a7bd5; box-shadow: 0 0 0 4px rgba(58, 123, 213, .18); }
.box.right { border-color: var(--green); box-shadow: 0 0 0 4px rgba(47, 174, 91, .22); background: #f1fbf4; }
.box.wrong { border-color: var(--red); box-shadow: 0 0 0 4px rgba(217, 83, 79, .18); }
.bulb { top: -14px; right: -14px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--teal); display: grid; place-items: center; padding: 0; }
.bulb svg { width: 62%; height: 62%; }
.inbulb { position: relative; display: inline-block; width: 32px; height: 32px; vertical-align: middle; margin-left: 6px; }
.inbulb .bulb { top: 0; right: 0; }
.bars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(560px, 100%); }
.opt { min-height: 60px; border-radius: 14px; border: 3px solid #d5dbe3; background: #fff; font-size: clamp(24px, 3.4vw, 32px); font-weight: 800; color: #4a4a4a; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; }
.opt small { font-size: 60%; color: #8a8a8a; }
.opt.sel { background: var(--navy); color: #fff; border-color: var(--navy); } .opt.sel small { color: #cfd8e3; }
.opt.right { background: #dff5e7; border-color: var(--green); color: #255e3a; } .opt.right small { color: #3b7a52; }
.opt.wrong { border-color: var(--red); }

/* number line */
.nlbox { width: 100%; max-width: 1100px; touch-action: none; }
.nlbox svg { display: block; width: 100%; }
.nlbox .tick { cursor: pointer; }
.nlbox .hop.new { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw .35s ease forwards; }
.nlbox .hoplab.new { opacity: 0; animation: show .2s .25s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes show { to { opacity: 1; } }
.nlbox .hopper.land { animation: land .35s ease; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes land { 0% { transform: translateY(-40%) scale(.9); } 70% { transform: translateY(4%) scale(1.06, .94); } 100% { transform: none; } }
.hoprow { width: min(640px, 100%); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hoprow button { min-height: clamp(48px, 7vh, 62px); border-radius: 14px; border: 2px solid #c8d3d0; background: #fff; font-size: clamp(16px, 2.2vw, 22px); font-weight: 800; color: #3d5a55; white-space: nowrap; padding: 0 6px; box-shadow: 0 3px 0 rgba(0, 0, 0, .1); }
.hoprow button.fwd { background: var(--teal-soft); border-color: var(--teal); color: var(--teal-dark); }
.hoprow button:disabled { opacity: .35; }

/* teaching board: hand-written working in the middle */
#board { position: absolute; z-index: 6; background: var(--paper); border-radius: 18px; box-shadow: 0 0 0 2px #efe6cf, 0 8px 24px rgba(0, 0, 0, .08);
  background-image: repeating-linear-gradient(transparent 0 calc(var(--rule) - 1px), #e9edf5 calc(var(--rule) - 1px) var(--rule)); }
#board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#board .bbtns { position: absolute; right: 10px; bottom: 8px; display: flex; gap: 8px; z-index: 2; }
#board .bbtns button { min-height: 44px; border-radius: 12px; border: 2px solid #c8d3d0; background: #fff; font-weight: 800; font-size: clamp(14px, 1.8vw, 18px); padding: 0 14px; color: #3d5a55; }
#board .bbtns button.x { width: 44px; padding: 0; font-size: 20px; }

/* tools: real-looking colour pencils, a rubber, a bin */
#tools { grid-area: tools; background: var(--panel); display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 12px 0 12px 8px; }
#tools .pencil { border: 0; background: transparent; padding: 0; width: 86%; height: clamp(30px, 4.6vh, 42px); transform: translateX(14%); transition: transform .18s ease; }
#tools .pencil.on { transform: translateX(0); }
#tools .pencil svg, #tools .rubber svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .18)); }
#tools .rubber { border: 0; background: transparent; padding: 0; width: 80%; height: clamp(40px, 6vh, 54px); margin-top: 8px; transform: translateX(16%); transition: transform .18s ease; }
#tools .rubber.on { transform: translateX(0); }
#tools .grow { flex: 1; }
#tools .bin { align-self: center; width: 52px; height: 52px; margin-right: 8px; border-radius: 14px; border: 2px solid #d4d4d4; background: #fff; display: grid; place-items: center; padding: 0; }
#tools .bin svg { width: 56%; height: 56%; }

#msg { grid-area: msg; display: flex; align-items: center; padding: 8px 16px; font-size: clamp(14px, 1.8vw, 18px); font-weight: 700; color: #fff; }
#msg.try { background: var(--amber); } #msg.wrong { background: var(--salmon); } #msg.right { background: #18ba98; } #msg.shown { background: var(--teal-dark); }

#keys { grid-area: keys; background: var(--keypad); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr) clamp(120px, 15vw, 170px); gap: 12px; }
#pad { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 10px; }
#pad button { min-height: clamp(54px, 9vh, 72px); border: 0; border-radius: 10px; background: var(--key); color: #444; font-size: clamp(22px, 3vw, 32px); box-shadow: 0 3px 0 rgba(0, 0, 0, .18); padding: 0; }
#app.locked #pad button { opacity: .45; pointer-events: none; }
#app.nokeys #pad { display: none; }
#tile { border-radius: 12px; border: 4px solid var(--blue-edge); background: var(--blue); color: #fff; font-weight: 900; font-size: clamp(18px, 2.2vw, 24px); line-height: 1.1; padding: 6px; min-height: clamp(54px, 9vh, 72px); }
#app.nokeys #keys { grid-template-columns: minmax(0, 1fr) clamp(140px, 22vw, 240px); }
#tile.see { background: var(--orange); border-color: #c86400; }
#tile.next { background: #00a985; border-color: #087a62; }
#tile.dim { opacity: .5; pointer-events: none; }

@media (max-width: 640px), (max-aspect-ratio: 3/4) and (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "top" "tools" "work" "msg" "keys"; }
  #tools { flex-direction: row; justify-content: center; align-items: flex-start; gap: 4px; padding: 6px 10px 0; background: transparent; height: 74px; }
  #tools .pencil { height: 68px; width: 30px; transform: translateY(-14px); }
  #tools .pencil.on { transform: translateY(0); }
  #tools .rubber { height: 64px; width: 34px; margin: 0 0 0 4px; transform: translateY(-10px); }
  #tools .rubber.on { transform: translateY(0); }
  #tools .grow { display: none; }
  #tools .bin { width: 44px; height: 44px; margin: 6px 0 0 6px; }
  #keys, #app.nokeys #keys { grid-template-columns: minmax(0, 1fr); }
  #pad { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  #pad button { min-height: 50px; } #tile { min-height: 54px; }
  .hoprow button { font-size: 15px; }
  .bars { gap: 8px; }
}
@media (max-height: 520px) and (orientation: landscape) {
  #top { padding: 6px 12px 0; } #speak { width: 40px; height: 40px; }
  #tools { gap: 3px; padding: 6px 0 6px 6px; } #tools .pencil { height: 24px; } #tools .rubber { height: 30px; margin-top: 4px; } #tools .bin { width: 38px; height: 38px; }
  #qbody { inset: 2px 12px 4px; } .qtop { padding-top: 0; gap: 6px; }
  .eq { font-size: 28px; } .qline, .story { font-size: 17px; } .story { line-height: 1.3; }
  .opt { min-height: 44px; } .room { min-height: 0; } .qbottom { gap: 4px; }
  .hoprow button { min-height: 38px; } .nlbox { max-width: 700px; }
  #keys { padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); gap: 8px; } #pad { gap: 6px; }
  #pad button, #tile { min-height: 42px; } #msg { padding: 4px 12px; }
  #app.lesson .hoprow { display: none; }      /* short screen: hide the hop buttons while the lesson board is open */
}

.band { position: fixed; left: 0; right: 0; top: 40%; z-index: 30; display: flex; align-items: center; justify-content: center; gap: 18px; color: #fff; pointer-events: none; overflow: hidden; }
.band.correct { height: clamp(80px, 16vh, 150px); background: #18ba98; animation: slidein 1.3s ease forwards; font-weight: 900; font-size: clamp(30px, 6vw, 56px); letter-spacing: .04em; }
.band.correct svg { height: 90%; }
@keyframes slidein { 0% { transform: translateX(100%); } 20% { transform: translateX(0); } 80% { transform: translateX(0); opacity: 1; } 100% { transform: scaleY(0); opacity: 0; } }
.band.oops { height: clamp(90px, 22vh, 200px); background: #808080; animation: grow 2s ease forwards; font-size: clamp(30px, 6vw, 52px); }
@keyframes grow { 0% { transform: scaleY(.02); } 12% { transform: scaleY(1); } 85% { opacity: 1; } 100% { opacity: 0; } }

.bubble { position: absolute; z-index: 8; left: 50%; transform: translateX(-50%); top: 40%; width: min(480px, calc(100% - 24px)); background: #fff; border: 3px solid #14aa9b; border-radius: 14px; padding: 12px 16px; box-shadow: 0 6px 20px rgba(0, 0, 0, .12); text-align: left; }
.bubble .bh { display: flex; gap: 10px; align-items: flex-start; }
.bubble .bh button { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--teal); display: grid; place-items: center; padding: 0; }
.bubble .bh button svg { width: 55%; height: 55%; }
.bubble h4 { margin: 0; color: #13998b; font-size: clamp(16px, 2vw, 20px); line-height: 1.35; }

.over { position: fixed; inset: 0; z-index: 40; background: rgba(20, 40, 40, .5); display: grid; place-items: center; padding: 16px; }
.panel { background: #fffaf2; border-radius: 22px; padding: 26px 24px; width: min(560px, 100%); text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
.panel h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 36px); color: #2d4b47; }
.panel p { margin: 8px 0; font-size: clamp(16px, 2.2vw, 20px); line-height: 1.45; }
.panel svg.big { width: 110px; height: 110px; }
.panel .go { margin-top: 16px; min-width: 220px; min-height: 60px; border: 0; border-radius: 16px; background: var(--teal); color: #fff; font-size: 24px; font-weight: 900; box-shadow: 0 5px 0 #087a62; }
.skillcard { background: #3fb36b; color: #fff; border-radius: 20px; padding: 46px 28px 26px; width: min(440px, 100%); text-align: center; position: relative; }
.skillcard .star { position: absolute; left: 50%; top: -42px; transform: translateX(-50%); width: 84px; }
.skillcard h2 { margin: 0; font-size: clamp(26px, 4vw, 34px); } .skillcard p { font-size: 22px; font-weight: 800; }
.skillcard button { border: 0; background: #2c7be5; color: #fff; font-weight: 900; font-size: 22px; border-radius: 12px; padding: 10px 44px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="top"><button id="speak" aria-label="Read the question out loud"></button><div id="dots" aria-label="Progress"></div></div>
  <div id="tools"></div>
  <div id="work"><canvas id="draw"></canvas><div id="qbody"></div></div>
  <div id="msg" hidden></div>
  <div id="keys"><div id="pad"></div><button id="tile">Check</button></div>
</div>
<script src="phrases.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const FAST = window.__demoFast ? 0.2 : 1;            // tests run the teaching faster
const wait = ms => new Promise(r => setTimeout(r, ms * FAST));

/* ---------- voice: recorded natural voice (voice/<hash>.mp3); browser voice only if a sentence was not recorded ---------- */
let actx = null, voiceList = null, playing = null, sayToken = 0;
if (window.__noVoice) voiceList = {};      // tests: check the words, not the recordings
else fetch("voice/manifest.json").then(r => r.ok ? r.json() : {}).then(m => voiceList = m).catch(() => voiceList = {});
function audioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  if (!actx) actx = new AC();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
const buffers = {};
async function clip(text) {
  const h = KM.fnv(text), ctx = audioCtx();
  if (!ctx || !voiceList || !voiceList[h]) return null;
  if (!buffers[h]) buffers[h] = fetch(`voice/${h}.mp3`).then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => ctx.decodeAudioData(b, ok, no)));
  try { return await buffers[h]; } catch (e) { return null; }
}
/* plain audio player: used where Web Audio is missing; unlocked on the first tap (iPad needs a tap before sound) */
const player = new Audio(); player.preload = "auto";
let unlocked = false;
document.addEventListener("pointerdown", () => {
  audioCtx();
  if (!unlocked && !(window.AudioContext || window.webkitAudioContext)) {
    unlocked = true; player.muted = true; player.src = `voice/${KM.fnv(KM.FIXED[6])}.mp3`;
    const p = player.play(); if (p) p.then(() => { player.pause(); player.muted = false; }).catch(() => { player.muted = false; });
  }
}, true);
function stopVoice() { sayToken++; try { if (playing) playing.stop(); } catch (e) {} playing = null; try { player.pause(); } catch (e) {} try { speechSynthesis.cancel(); } catch (e) {} }
/* say(): speaks and resolves when finished (or after a time estimate) */
async function say(text) {
  stopVoice(); const me = sayToken;
  const est = 600 + text.length * 62;
  const h = KM.fnv(text), recorded = voiceList && voiceList[h];
  if (recorded && !(window.AudioContext || window.webkitAudioContext)) {
    return new Promise(res => {
      player.muted = false; player.src = `voice/${h}.mp3`; player.onended = () => res();
      const p = player.play(); if (p) p.catch(() => res());
      setTimeout(res, est * 2);
    });
  }
  const buf = await clip(text);
  if (me !== sayToken) return;
  if (buf) {
    return new Promise(res => {
      const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination); playing = src;
      src.onended = () => res(); src.start(); setTimeout(res, buf.duration * 1000 + 400);
    });
  }
  try {
    if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(text.replace(/−/g, " minus "));
      u.lang = "en-US"; u.rate = .95; u.pitch = 1;
      const v = speechSynthesis.getVoices().find(v => /^en/i.test(v.lang) && /Samantha|Ava|Karen|Daniel|Google/i.test(v.name)); if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
  return new Promise(r => setTimeout(r, est * FAST));
}
function chime() {
  const ctx = audioCtx(); if (!ctx) return;
  [[660, 0], [880, .14]].forEach(([f, t]) => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, ctx.currentTime + t); g.gain.linearRampToValueAtTime(.1, ctx.currentTime + t + .03);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .6);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .65);
  });
}

/* ---------- drawings (our own) ---------- */
const ICON = {
  speaker: `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  bulb: `<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V17h5.2v-1.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="#fff"/><rect x="9.4" y="18.2" width="5.2" height="2.4" rx="1" fill="#fff"/></svg>`,
  close: `<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`,
  bin: `<svg viewBox="0 0 24 24" fill="#666"><rect x="6" y="7" width="12" height="14" rx="2"/><rect x="4" y="4" width="16" height="2.4" rx="1"/><rect x="9" y="2" width="6" height="2" rx="1"/></svg>`,
  star: `<svg viewBox="0 0 100 100"><path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z" fill="#ffd34d" stroke="#e0a800" stroke-width="3" stroke-linejoin="round"/><circle cx="41" cy="50" r="4" fill="#3a2a00"/><circle cx="59" cy="50" r="4" fill="#3a2a00"/><path d="M41 61 Q50 69 59 61" stroke="#3a2a00" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
};
const PENS = [["#2c3e50", "#1c2833"], ["#2f80ed", "#1f5fb8"], ["#27ae60", "#1b7f45"], ["#e74c3c", "#b8382b"], ["#f39c12", "#c27a08"], ["#9b51e0", "#7438ad"]];
/* a real-looking colour pencil: coloured lead, sharpened wood, hexagon body with light and dark faces, end cap.
   Drawn pointing left (side panel) or pointing down (phone row). */
function pencilSVG(col, dark, down) {
  const L = 140, W = 30, P = (x, y) => down ? `${y},${L - x}` : `${x},${y}`;
  const poly = (pts, fill, extra = "") => `<polygon points="${pts.map(p => P(p[0], p[1])).join(" ")}" fill="${fill}" ${extra}/>`;
  const vb = down ? `0 0 ${W} ${L}` : `0 0 ${L} ${W}`;
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    ${poly([[0, 15], [13, 11], [13, 19]], col)}
    ${poly([[13, 11], [36, 3], [36, 27], [13, 19]], "#f4d7a8")}
    ${poly([[13, 11], [36, 3], [36, 9]], "#e9c48c")}
    ${poly([[36, 3], [42, 5], [36, 9], [42, 11], [36, 15], [42, 17], [36, 21], [42, 23], [36, 27]], "#f4d7a8")}

function buildTools() {
  const down = matchMedia(NARROW).matches;
  $("#tools").innerHTML = PENS.map(([c, d]) => `<button class="pencil" data-c="${c}" aria-label="Colour pencil">${pencilSVG(c, d, down)}</button>`).join("")
    + `<button class="rubber" data-t="erase" aria-label="Rubber">${rubberSVG(down)}</button><div class="grow"></div><button class="bin" data-t="clear" aria-label="Clear the drawing">${ICON.bin}</button>`;
  $("#tools").querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.t === "clear") return clearDraw();
    pen = b.dataset.c || "erase"; markTools();
  });
  markTools();
}
function markTools() { $("#tools").querySelectorAll("button").forEach(b => b.classList.toggle("on", (b.dataset.c || b.dataset.t) === pen)); }
let gd = null;
function sizeDraw() {
  const c = $("#draw"), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
  gd = c.getContext("2d"); gd.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function clearDraw() { const c = $("#draw"); if (gd) { gd.save(); gd.setTransform(1, 0, 0, 1, 0, 0); gd.clearRect(0, 0, c.width, c.height); gd.restore(); } }
function setupDraw() {
  const c = $("#draw"); let last = null;
  const at = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  const style = () => { const er = pen === "erase"; gd.globalCompositeOperation = er ? "destination-out" : "source-over";
    gd.strokeStyle = er ? "#000" : pen; gd.fillStyle = gd.strokeStyle; gd.lineWidth = er ? 30 : 5; gd.lineCap = gd.lineJoin = "round"; };
  c.onpointerdown = e => { if (!gd) return; e.preventDefault(); c.setPointerCapture(e.pointerId); last = at(e); style(); gd.beginPath(); gd.arc(last[0], last[1], gd.lineWidth / 2, 0, 7); gd.fill(); };
  c.onpointermove = e => { if (!last) return; e.preventDefault(); const p = at(e); style(); gd.beginPath(); gd.moveTo(last[0], last[1]); gd.lineTo(p[0], p[1]); gd.stroke(); last = p; };
  c.onpointerup = c.onpointercancel = () => last = null;
}

/* ---------- cards ---------- */
function overlay(html) {
  return new Promise(res => {
    const o = document.createElement("div"); o.className = "over"; o.innerHTML = html; document.body.appendChild(o);
    o.querySelector("button").onclick = () => { o.remove(); res(); };
  });
}
function skillCard() {
  say(`Skill complete! ${skill.name}.`);
  return overlay(`<div class="skillcard"><svg class="star" viewBox="0 0 24 24"><path d="M12 2l3 7 7.5.6-5.7 4.9 1.8 7.3L12 17.9 5.4 21.8l1.8-7.3L1.5 9.6 9 9z" fill="#ffd34d" stroke="#d89b00"/><text x="12" y="15" font-size="6" text-anchor="middle" font-weight="900" fill="#7a5600">+1</text></svg><h2>SKILL COMPLETE!</h2><p>${skill.name}</p><button>OK!</button></div>`);
}
async function finish() {
  QS = null; drawDots();
  say(`Well done! You finished ${SET} questions.`);
  await overlay(`<div class="panel">${ICON.star.replace("<svg", '<svg class="big"')}<h1>${SET} questions done!</h1><p>Skill score: ${skill.theta.toFixed(1)} of 3</p><button class="go">Play again</button></div>`);
  n = 0; nextQuestion();
}

/* ---------- start ---------- */
$("#speak").innerHTML = ICON.speaker; $("#speak").onclick = () => QS && say(Q.say);
$("#tile").onclick = tile;
buildTools(); buildPad(); setupDraw();
let wasNarrow = matchMedia(NARROW).matches;
addEventListener("resize", () => {
  const nw = matchMedia(NARROW).matches; if (nw !== wasNarrow) { wasNarrow = nw; buildTools(); }
  buildPad(); sizeDraw(); if (QS) renderBody();
});
requestAnimationFrame(sizeDraw);
drawDots();
overlay(`<div class="panel">${ICON.star.replace("<svg", '<svg class="big"')}<h1>Maths practice demo</h1>
  <p>${SET} questions, one after another. Hop on the number line, or draw in the empty space, to work it out.</p>
  <p>Plain look for now. The kitty story and the knight story come later.</p><button class="go">Start</button></div>`)
  .then(() => { audioCtx(); sizeDraw(); say("Let's go!"); setTimeout(nextQuestion, 900 * FAST); });
window.__demo = { get Q() { return Q; }, get QS() { return QS; }, skill, get n() { return n; },
  lesson(kind, a, b) { closeBoard(); Q = KM.build(kind, a, b); QS = { tries: 1, phase: "ask", typed: "", pick: null, line: null, hops: [], lo: null, hi: null };   // for tests: show one lesson
    $("#app").classList.toggle("nokeys", !Q.typed); renderBody(); return teach(); } };
</script>
</body>
</html>
