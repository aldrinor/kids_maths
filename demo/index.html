.book { width: calc(var(--u) * 10); height: calc(var(--u) * 11); }

@keyframes slidein { 0% { transform: translate(100%, -50%); } 18% { transform: translate(0, -50%); } 82% { transform: translate(0, -50%); opacity: 1; } 100% { transform: translate(0, -50%) scaleY(0); opacity: 0; } }

<body>
<div id="stage">
  <div id="scene"></div>
  <div id="banner" aria-live="polite"></div>
  <div id="spells"></div>
  <div id="detail" hidden></div>
</div>

<script>
"use strict";
/* ================= size: a 4:3 stage that fits the iPad screen ================= */
const stage = document.getElementById("stage");
function fit() {
  const w = Math.min(innerWidth, innerHeight * 4 / 3), h = w * 3 / 4;
  stage.style.width = w + "px"; stage.style.height = h + "px";
  document.documentElement.style.setProperty("--u", (w / 100) + "px");
}
addEventListener("resize", fit); fit();

/* ================= voice and one soft chime ================= */
function speak(t) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/×/g, " times ").replace(/−/g, " minus "));
    u.lang = "en-US"; u.rate = .95; u.pitch = 1;
    const v = speechSynthesis.getVoices().find(v => /en(-|_)(US|GB|CA)/i.test(v.lang) && /Samantha|Ava|Karen|Daniel|Google/i.test(v.name));
    if (v) u.voice = v;

const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
let qCount = 0;
function makeQuestion() {
  const kinds = ["add", "word", "bars", "compare", "line", "sub", "add2"];
  const kind = kinds[qCount++ % kinds.length];
  if (kind === "add") { const a = R(6, 9), b = R(3, 8); return { kind, type: "typed", line: "Add:", a, b, op: "+", ans: a + b, say: `Add. ${a} plus ${b} equals what?`, hint: { text: `Start at ${a}. Make ${b} hops forward.`, from: a, hops: b, dir: 1 } }; }

  if (kind === "word") { const a = R(12, 18), b = R(4, 9); return { kind, type: "typed", word: true, story: `There are ${a} apples in a basket. You eat ${b} of them.`, ask: "How many are left?", ans: a - b, say: `There are ${a} apples in a basket. You eat ${b} of them. How many are left?`, hint: { text: `Take away means hops back. Start at ${a}. Make ${b} hops back.`, from: a, hops: b, dir: -1 } }; }
  if (kind === "bars") { const a = R(5, 9), ans = a + a, opts = shuffle([ans, ans - 1, ans + 2]); return { kind, type: "bars", line: `What is ${a} + ${a}?`, opts, ans, say: `What is ${a} plus ${a}? a, ${opts[0]}. b, ${opts[1]}. c, ${opts[2]}.`, hint: { text: `${a} + ${a} is a double. Start at ${a}. Make ${a} hops forward.`, from: a, hops: a, dir: 1 } }; }
  if (kind === "compare") { let a = R(11, 29), b = R(11, 29); if (Math.random() < .2) b = a; const ans = a < b ? "<" : a > b ? ">" : "="; return { kind, type: "compare", a, b, ans, say: `Pick the sign. ${a}, what, ${b}. Less than, greater than, or equal?`, hint: { text: `Compare the tens first. The bigger number goes on the open side of the sign.`, cmp: [a, b] } }; }

}

/* number line picture with exactly the right number of hops (blueprint 2.14 warning) */
function numberLine(h) {
  if (h.tens) return "";
  if (h.cmp) { const lo = Math.min(...h.cmp) - (Math.min(...h.cmp) % 10), hi = lo + 20;
    return nlSvg(lo, hi, h.cmp.map(n => ({ n, c: "#13998b" })), []); }
  const lo = h.dir > 0 ? h.from : h.from - h.hops, hi = h.dir > 0 ? h.from + h.hops : h.from;
  const arcs = Array.from({ length: h.hops }, (_, i) => h.dir > 0 ? [h.from + i, h.from + i + 1] : [h.from - i, h.from - i - 1]);

function nlSvg(lo, hi, marks, arcs) {
  const W = 460, pad = 20, step = (W - pad * 2) / (hi - lo), X = n => pad + (n - lo) * step;
  let s = `<svg class="nlh" viewBox="0 0 ${W} 92"><line x1="${pad - 8}" y1="60" x2="${W - pad + 8}" y2="60" stroke="#555" stroke-width="2"/>`;
  for (let n = lo; n <= hi; n++) s += `<line x1="${X(n)}" y1="53" x2="${X(n)}" y2="67" stroke="#555" stroke-width="2"/><text x="${X(n)}" y="86" font-size="${hi - lo > 14 ? 11 : 14}" text-anchor="middle" fill="#444">${n}</text>`;
  arcs.forEach(([a, b]) => { const x1 = X(a), x2 = X(b), m = (x1 + x2) / 2; s += `<path d="M${x1} 56 Q${m} 26 ${x2} 56" stroke="#f08a24" stroke-width="2.4" fill="none"/>`; });
  marks.forEach(m => s += `<circle cx="${X(m.n)}" cy="60" r="7" fill="${m.c}"/>`);

  const b = document.getElementById("qbody"), bulb = `<button class="bulb" aria-label="Hint">${ART.bulb}</button>`;
  if (Q.type === "typed" && !Q.word) b.innerHTML = `<div class="qline">${Q.line}</div><div class="eq"><span>${Q.a}</span><span>${Q.op}</span><span>${Q.b}</span><span>=</span><span class="box active" id="ansBox">${QS.typed || "&nbsp;"}${bulb}</span></div>`;
  else if (Q.word) b.innerHTML = `<div class="story">${Q.story}<br><b>${Q.ask}</b><span class="inbulb">${bulb}</span></div><div class="eq"><span class="box active" id="ansBox">${QS.typed || "&nbsp;"}</span></div>`;
  else if (Q.type === "bars") b.innerHTML = `<div class="qline">What is <span class="kw">${Q.line.replace("What is ", "").replace("?", "")}</span>?<span class="inbulb">${bulb}</span></div><div class="bars">${Q.opts.map((o, i) => `<button class="opt" data-v="${o}"><small>${"abc"[i]})</small>${o}</button>`).join("")}</div>`;
  else if (Q.type === "compare") b.innerHTML = `<div class="qline">Pick the <span class="kw">sign</span>.<span class="inbulb">${bulb}</span></div><div class="eq"><span>${Q.a}</span><span class="box active" id="ansBox">${QS.pick || "&nbsp;"}</span><span>${Q.b}</span></div><div class="pills">${["<", ">", "="].map(o => `<button class="opt" data-v="${o}">${o}</button>`).join("")}</div>`;
  else b.innerHTML = `<div class="qline">Tap where <span class="kw">${Q.target}</span> goes on the number line.<span class="inbulb">${bulb}</span></div>${lineSvg()}`;
  b.querySelectorAll(".bulb").forEach(x => x.onclick = e => { e.stopPropagation(); toggleHint(); });
  b.querySelectorAll(".opt").forEach(x => x.onclick = () => { if (QS.phase !== "ask") return; QS.pick = x.dataset.v; renderBody(); speak(x.dataset.v === "<" ? "less than" : x.dataset.v === ">" ? "greater than" : x.dataset.v === "=" ? "equal" : x.dataset.v); });
  if (QS.pick != null) b.querySelectorAll(`.opt[data-v="${CSS.escape(String(QS.pick))}"]`).forEach(x => x.classList.add("sel"));
  b.querySelectorAll(".tick").forEach(x => x.onclick = () => { if (QS.phase !== "ask") return; QS.pick = +x.dataset.n; renderBody(); });
}
function lineSvg() {
  const lo = Q.start, hi = Q.start + 10, W = 700, pad = 40, step = (W - pad * 2) / 10, X = n => pad + (n - lo) * step;
  let s = `<svg class="nl" viewBox="0 0 ${W} 130"><line x1="${pad - 20}" y1="70" x2="${W - pad + 20}" y2="70" stroke="#555" stroke-width="3"/>`;
  for (let n = lo; n <= hi; n++) {
    const lab = n === lo || n === hi || n === lo + 5;
    const st = QS.state && n === Q.ans && QS.phase !== "ask" ? "#2fae5b" : QS.pick === n ? (QS.wrongMark ? "#d9534f" : "#2c3e50") : null;
    s += `<g class="tick" data-n="${n}"><rect x="${X(n) - step / 2}" y="20" width="${step}" height="100" fill="transparent"/><line x1="${X(n)}" y1="58" x2="${X(n)}" y2="82" stroke="#555" stroke-width="3"/>
      ${lab ? `<text x="${X(n)}" y="112" font-size="22" text-anchor="middle" fill="#444" font-weight="700">${n}</text>` : ""}
      ${st ? `<circle cx="${X(n)}" cy="44" r="12" fill="${st}"/>` : ""}</g>`;
  }
  if (QS.phase === "shown" || QS.phase === "right") s += `<text x="${X(Q.ans)}" y="24" font-size="20" text-anchor="middle" fill="#2fae5b" font-weight="800">${Q.ans}</text>`;
  return s + "</svg>";
}
function renderTools() {
  const m = document.getElementById("toolMain");
  if (QS.tab === "grid") {
    m.innerHTML = `<div class="ctool">● Counters</div><div class="cdots">${["#a7c7f2", "#a8e0b0", "#fbe38e", "#f6a7a1", "#d7c3f2"].map(c => `<span style="background:${c}" data-c="${c}"></span>`).join("")}</div>`;
    m.querySelectorAll(".cdots span").forEach(s => s.onpointerdown = e => dragCounter(e, s.dataset.c));
  } else {
    m.innerHTML = PENS.map(c => `<button class="pencil ${QS.pen === c ? "on" : ""}" style="background:${c};--c:${c}" data-c="${c}" aria-label="Pencil"></button>`).join("") + `<button class="eraser ${QS.pen === "erase" ? "on" : ""}" aria-label="Eraser"></button>`;
    m.querySelectorAll(".pencil").forEach(p => p.onclick = () => { QS.pen = QS.pen === p.dataset.c ? null : p.dataset.c; renderTools(); });
    m.querySelector(".eraser").onclick = () => { QS.pen = QS.pen === "erase" ? null : "erase"; renderTools(); };
  }
  document.getElementById("q").classList.toggle("drawing", QS.tab === "pen" && !!QS.pen);
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === QS.tab));
}
function tab(t) {
  if (t === "trash") { const c = document.getElementById("draw"); c.getContext("2d").clearRect(0, 0, c.width, c.height); document.querySelectorAll(".counter").forEach(x => x.remove()); return; }
  QS.tab = t; if (t === "grid") QS.pen = null; renderTools();
}
function setupDraw() {
  const c = document.getElementById("draw"), w = document.getElementById("work"), r = w.getBoundingClientRect();
  c.width = r.width; c.height = r.height; const g = c.getContext("2d"); let last = null;
  c.onpointerdown = e => { if (!QS.pen) return; c.setPointerCapture(e.pointerId); last = [e.offsetX, e.offsetY]; };
  c.onpointermove = e => { if (!last) return;
    g.globalCompositeOperation = QS.pen === "erase" ? "destination-out" : "source-over";
    g.strokeStyle = QS.pen === "erase" ? "#000" : QS.pen; g.lineWidth = QS.pen === "erase" ? 26 : 5; g.lineCap = "round";
    g.beginPath(); g.moveTo(...last); g.lineTo(e.offsetX, e.offsetY); g.stroke(); last = [e.offsetX, e.offsetY]; };
  c.onpointerup = c.onpointercancel = () => last = null;
}
function dragCounter(e, color) {
  e.preventDefault();
  const work = document.getElementById("work"), r = work.getBoundingClientRect(), d = document.createElement("div");
  d.className = "counter"; d.style.background = color; work.appendChild(d);
  const move = ev => { d.style.left = (ev.clientX - r.left) + "px"; d.style.top = (ev.clientY - r.top) + "px"; };
  move(e);
  const up = ev => { removeEventListener("pointermove", move); removeEventListener("pointerup", up);
    if (ev.clientX > r.right || ev.clientY > r.bottom) d.remove();
    else d.onpointerdown = e2 => { e2.preventDefault(); addEventListener("pointermove", move); addEventListener("pointerup", () => removeEventListener("pointermove", move), { once: true }); }; };
  addEventListener("pointermove", move); addEventListener("pointerup", up);
}
function key(k) {
  if (QS.phase !== "ask" || Q.type !== "typed") return;
  if (k === "⌫") QS.typed = QS.typed.slice(0, -1);
  else if (/^\d$/.test(k) && QS.typed.length < 4) QS.typed += k;
  else return;
  const box = document.getElementById("ansBox"); box.firstChild.nodeValue = QS.typed || "\u00a0";
  box.classList.remove("wrong");
}
function answerNow() { return Q.type === "typed" ? (QS.typed === "" ? null : +QS.typed) : Q.type === "compare" ? QS.pick : QS.pick == null ? null : +QS.pick; }
function msg(cls, text) {
  const m = document.getElementById("msg"); m.hidden = false; m.className = cls;
  m.innerHTML = `<span>${text}</span><button aria-label="Close">×</button>`;
  m.querySelector("button").onclick = () => m.hidden = true;
}
function tileTo(cls, text, icon) {
  const t = document.getElementById("tile"); t.className = cls; t.innerHTML = (icon ? ART.crystal : "") + `<span>${text}</span>`;
}
function markAnswer(right) {
  const box = document.getElementById("ansBox");
  if (box) { box.classList.remove("wrong", "right", "active"); box.classList.add(right ? "right" : "wrong"); }
  document.querySelectorAll("#qbody .opt.sel").forEach(o => o.classList.add(right ? "right" : "wrong"));
  if (Q.type === "line") { QS.wrongMark = !right; renderBody(); }
}
async function tile() {
  if (QS.phase === "ask") {
    const a = answerNow();
    if (a == null) { speak(Q.type === "typed" ? "Type your answer first." : "Pick an answer first."); return; }
    if (a === Q.ans) {
      QS.phase = "right"; skill.theta += .6; chime();
      markAnswer(true); document.getElementById("q").classList.add("locked");
      msg("right", "This is the correct answer!"); tileTo("back", "Back to Battle");
      band("correct"); speak("Correct! " + spoken());
      return;
    }
    QS.tries++;
    if (QS.tries === 1) {                                   // first miss: try again (blueprint 2.18)
      skill.theta -= 1.2; markAnswer(false);
      msg("try", "That answer was incorrect. Change your answer and try again!");
      speak("That answer was incorrect. Change your answer and try again!");
      if (Q.type === "typed") { QS.typed = ""; setTimeout(() => { const b = document.getElementById("ansBox"); if (b) { b.firstChild.nodeValue = "\u00a0"; b.classList.add("active"); } }, 900); }
      return;
    }
    QS.phase = "final"; markAnswer(false);                   // final miss (blueprint 2.19)
    document.getElementById("q").classList.add("locked");
    msg("wrong", "That answer was incorrect."); tileTo("see dim", "See The Answer");
    band("oops"); speak("Oops. Let's see the answer.");
    await wait(2400); document.getElementById("tile").classList.remove("dim");
    return;
  }
  if (QS.phase === "final") {                                // See The Answer (blueprint 2.20) plus our teaching step
    QS.phase = "shown"; showAnswer();
    msg("shown", "This is the correct answer!"); tileTo("back", "Back to Battle");
    openHint(true); speak("This is the correct answer. " + spoken() + " " + Q.hint.text);
    return;
  }
  closeQuestion(QS.phase === "right");
}
function spoken() {
  if (Q.type === "typed" && !Q.word) return `${Q.a} ${Q.op === "+" ? "plus" : "minus"} ${Q.b} equals ${Q.ans}.`;
  if (Q.type === "compare") return `${Q.a} is ${Q.ans === "<" ? "less than" : Q.ans === ">" ? "greater than" : "equal to"} ${Q.b}.`;
  return `The answer is ${Q.ans}.`;
}
function showAnswer() {
  if (Q.type === "typed") { QS.typed = String(Q.ans); const b = document.getElementById("ansBox"); b.firstChild.nodeValue = QS.typed; b.className = "box right"; }
  else if (Q.type === "line") { QS.pick = Q.ans; QS.wrongMark = false; QS.state = 1; renderBody(); }
  else { QS.pick = Q.ans; renderBody(); document.querySelectorAll("#qbody .opt.sel").forEach(o => o.classList.add("right"));
    const b = document.getElementById("ansBox"); if (b) { b.textContent = Q.ans; b.className = "box right"; } }
}
function band(kind) {
  const b = document.createElement("div"); b.className = "band " + kind;
  b.innerHTML = kind === "correct" ? `${ART.mascot}<span>CORRECT! ✓</span>` : `<span>Oops...</span>`;
  document.getElementById("q").appendChild(b); setTimeout(() => b.remove(), kind === "correct" ? 1700 : 2500);
}
function toggleHint() { if (document.querySelector(".bubble")) closeHint(); else openHint(false); }
function openHint(auto) {
  closeHint();
  const h = document.createElement("div"); h.className = "bubble";
  h.innerHTML = `<div class="bh"><button aria-label="Read hint">${ART.speaker}</button><h4>${Q.hint.text}</h4></div>${numberLine(Q.hint)}`;
  h.querySelector("button").onclick = () => speak(Q.hint.text);
  document.getElementById("work").appendChild(h);
  document.querySelectorAll("#qbody .bulb").forEach(b => b.innerHTML = ART.close);
  if (!auto) speak(Q.hint.text);
}
function closeHint() { document.querySelectorAll(".bubble").forEach(b => b.remove()); document.querySelectorAll("#qbody .bulb").forEach(b => b.innerHTML = ART.bulb); }

async function closeQuestion(right) {
  document.getElementById("q").remove();
  const u = owner;
  if (right) {
    u.magic = u.slots; drawStat(u);                         // one right answer fills the active unit only (blueprint 3.1)
    banner("Magic Refilled!");
    if (skill.theta >= 3 && !skill.learned) { skill.learned = true; await wait(900); await skillCard(); }
    await wait(600); teamTurn(u);
  } else {
    await wait(900); pop(u, "Fumble"); speak(`${u.name} fumbled and loses this turn.`);
    await wait(1800); nextTurn();
  }
}

/* ================= cards: skill complete, win, lose ================= */
function overlay(html) {
  return new Promise(res => {
    const o = document.createElement("div"); o.className = "over"; o.innerHTML = html; stage.appendChild(o);
    o.querySelector("button").onclick = () => { o.remove(); res(); };
  });
}
function skillCard() {
  speak(`Correct! Skill complete! ${skill.name}.`);
  return overlay(`<div class="skillcard"><svg class="star" viewBox="0 0 24 24"><path d="M12 2l3 7 7.5.6-5.7 4.9 1.8 7.3L12 17.9 5.4 21.8l1.8-7.3L1.5 9.6 9 9z" fill="#ffd34d" stroke="#d89b00"/><text x="12" y="15" font-size="6" text-anchor="middle" font-weight="900" fill="#7a5600">+1</text></svg>
    <h2>SKILL COMPLETE!</h2><p>${skill.name}</p><button>OK!</button></div>`);
}
async function win() {
  setActive(null); setCards(false);
  await wait(600);
  level++; units.filter(u => u.side === "team").forEach(u => u.lvl = level);
  speak(`Great job! You reached level ${level}.`);
  await overlay(`<div class="panel"><div class="ribbon">Great job! You reached level ${level}</div>
    <div style="display:flex;justify-content:center;gap:calc(var(--u)*3)">${ART.hero}${ART.buddy}</div>
    <button class="go">Continue</button></div>`);
  speak("You earned 10 stars.");
  await overlay(`<div class="panel"><div class="ribbon">You earned <em>10 Stars</em></div>
    <div class="gifts"><div>${ART.starIcon}x10</div><div>${ART.mascot.replace("<svg", "<svg")}New friend</div><div>${ART.crystal}x1</div></div>
    <button class="go">Continue</button></div>`);
  speak("The demo battle is finished. Play again?");
  await overlay(`<div class="panel"><h1>Demo finished</h1><p>The grumpy clouds all feel better.</p><p>Skill score: ${skill.theta.toFixed(1)} of 3</p><button class="go">Play again</button></div>`);
  newBattle(); start();
}
async function lose() {
  setActive(null);
  speak("Don't worry, you'll get them next time!");
  await overlay(`<div class="panel"><h1>Time for a rest</h1><p>Don't worry, you'll get them next time!</p><button class="go">Try again</button></div>`);
  newBattle(); start();
}

/* ================= start ================= */
async function start() {
  const v = document.createElement("div"); v.id = "vs"; v.innerHTML = "<span>VS</span>"; stage.appendChild(v);
  await wait(1500); v.remove(); nextTurn();
}
newBattle();
overlay(`<div class="panel"><h1>Battle demo</h1><p>This follows Prodigy's maths battle: when magic runs out, a maths question refills it.</p>
  <p>Plain characters for now. The kitty story and the knight story come later.</p><button class="go">Start</button></div>`)
  .then(() => { speak("Let's go!"); start(); });
window.__demo = { get Q() { return Q; }, get QS() { return QS; }, units: () => units, skill };
</script>
